name: Apply Milestone 9 fingerprint foundation on master

on:
  push:
    branches: [master]
    paths:
      - tools/apply-m9-fingerprint-foundation-master.py

permissions:
  contents: write

concurrency:
  group: apply-m9-fingerprint-foundation-master
  cancel-in-progress: false

jobs:
  apply-test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply fingerprint foundation
        run: |
          python tools/apply-m9-fingerprint-foundation-master.py
          cargo fmt
      - name: Run focused Rust verification
        run: |
          cargo test -p a2d-image --all-features
          cargo test -p a2d-core milestone9 --all-features
          cargo clippy -p a2d-image -p a2d-core --all-targets --all-features -- -D warnings
      - name: Commit verified changes directly to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-m9-fingerprint-foundation-master.py
          git rm .github/workflows/apply-m9-fingerprint-foundation-master.yml
          git add -A
          git commit -m "Add versioned scan perceptual fingerprints"
          git push origin HEAD:master
