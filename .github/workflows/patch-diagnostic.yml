name: Patch Diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/unit-test-coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unit-test-coverage
      - name: Diagnose patch application
        shell: bash
        run: |
          set +e
          exec > >(tee "$RUNNER_TEMP/diagnostic.txt") 2>&1
          echo "base64 bytes: $(wc -c < tools/unit-test-coverage.patch.gz.b64)"
          base64 --decode tools/unit-test-coverage.patch.gz.b64 > "$RUNNER_TEMP/patch.gz"
          echo "base64 status=$? gzip bytes=$(wc -c < "$RUNNER_TEMP/patch.gz")"
          gzip -t "$RUNNER_TEMP/patch.gz"
          echo "gzip test status=$?"
          gzip -dc "$RUNNER_TEMP/patch.gz" > "$RUNNER_TEMP/patch"
          echo "gzip decode status=$? patch bytes=$(wc -c < "$RUNNER_TEMP/patch")"
          git apply --check "$RUNNER_TEMP/patch"
          echo "primary check status=$?"
          git apply --whitespace=fix "$RUNNER_TEMP/patch"
          echo "primary apply status=$?"
          git apply --check tools/unit-test-coverage-followup.patch
          echo "follow-up check status=$?"
          git status --short
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-patch-diagnostic
          path: ${{ runner.temp }}/diagnostic.txt
          retention-days: 1
