name: Validate Milestone 6 Android

on:
  push:
    branches: [master]
    paths:
      - apps/android/**
      - crates/a2d-core/**
      - crates/a2d-ffi/**
      - crates/a2d-storage/**
      - .github/workflows/milestone6-android-apply.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: milestone6-android-validation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed source and Android gates
        id: gates
        shell: bash
        run: |
          if [ -f docs/MILESTONE6_VALIDATION_PASS.md ] || [ -f docs/MILESTONE6_VALIDATION_FAILURE.md ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          LOG="$RUNNER_TEMP/milestone6-validation.log"
          (
            set -euo pipefail
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            cargo build -p a2d-ffi --lib
            rm -rf /tmp/a2d-m6-kotlin apps/android/app/src/main/kotlin/uniffi
            cargo run -p a2d-ffi --bin uniffi-bindgen -- generate \
              --library target/debug/liba2d_ffi.so \
              --language kotlin \
              --out-dir /tmp/a2d-m6-kotlin \
              --no-format
            mkdir -p apps/android/app/src/main/kotlin/uniffi/a2d_ffi
            cp /tmp/a2d-m6-kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
              apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            (cd apps/android && ./gradlew lint test assembleDebug --no-daemon --stacktrace)
          ) >"$LOG" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log=$LOG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated bindings and pass evidence
        if: steps.gates.outputs.status == '0'
        shell: bash
        run: |
          cat > docs/MILESTONE6_VALIDATION_PASS.md <<'EOF'
          # Milestone 6 validation passed

          The scheduled fail-closed validation completed successfully:

          - `cargo fmt --all --check`
          - `cargo clippy --workspace --all-targets --all-features -- -D warnings`
          - `cargo test --workspace --all-features`
          - Kotlin UniFFI binding regeneration
          - Android lint
          - Android unit tests
          - Android debug assembly
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/main/kotlin/uniffi docs/MILESTONE6_VALIDATION_PASS.md
          git commit -m "Validate Milestone 6 Android workflows"
          git push origin HEAD:master
      - name: Commit diagnostics without broken generated output
        if: steps.gates.outputs.status != '0' && steps.gates.outputs.status != 'skip'
        shell: bash
        run: |
          LOG="${{ steps.gates.outputs.log }}"
          git reset --hard HEAD
          {
            echo "# Milestone 6 validation failure"
            echo
            echo '```text'
            tail -n 1200 "$LOG"
            echo '```'
          } > docs/MILESTONE6_VALIDATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MILESTONE6_VALIDATION_FAILURE.md
          git commit -m "Record Milestone 6 validation failure"
          git push origin HEAD:master
          exit 1
