name: Finalize Milestone 6

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: milestone6-final-validation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: Swatinem/rust-cache@v2
      - name: Run complete final gates
        id: gates
        shell: bash
        run: |
          git fetch origin master
          git reset --hard origin/master
          if [ ! -f .github/workflows/milestone6-android-apply.yml ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          LOG="$RUNNER_TEMP/milestone6-final-validation.log"
          (
            set -euo pipefail
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            if ! command -v cargo-deny >/dev/null 2>&1; then
              cargo install cargo-deny --locked
            fi
            cargo deny check
            (cd apps/android && ./gradlew lint test assembleDebug --no-daemon --stacktrace)
            rustup target add x86_64-linux-android
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
            sdkmanager --install "ndk;27.0.12077973"
            if ! command -v cargo-ndk >/dev/null 2>&1; then
              cargo install cargo-ndk --locked
            fi
            ./tools/build-android-native.sh
            git diff --exit-code -- apps/android/app/src/main/kotlin/uniffi
            (cd apps/android && ./gradlew assembleDebug --no-daemon --stacktrace)
          ) >"$LOG" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log=$LOG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Update TODO evidence and remove validation machinery
        if: steps.gates.outputs.status == '0'
        shell: bash
        run: |
          cat > /tmp/finalize_milestone6.py <<'PY'
          from pathlib import Path

          path = Path("docs/A2D_SMART_NOTEBOOK_V01_TODO.md")
          text = path.read_text()

          old_layout = """- [ ] Generate blank verso pages. Deferred to Milestone 5.4 (PDF renderer) — this task defines
                layout geometry, not PDF bytes; there's nothing to \"generate\" yet without a renderer.
          - [ ] Generate a complete proof interior PDF. Same as above — Milestone 5.4's job once the PDF
                renderer exists; this task's layouts are what it will render from.
          """
          new_layout = """- [x] Generate blank verso pages. `a2d_pdf::generate_notebook_proof_interior_pdf` emits a
                blank verso after the Setup Page and after every logical-page recto.
          - [x] Generate a complete proof interior PDF. The Rust proof generator creates the Setup Page,
                blank versos, writable rectos, deterministic logical numbering, and verified output bytes.
          """
          if old_layout not in text:
              raise SystemExit("stale Milestone 5.3 marker block was not found")
          text = text.replace(old_layout, new_layout, 1)

          start_marker = "# Milestone 6 — Notebook and Smart Page workflows"
          end_marker = "\n---\n\n# Milestone 7 — Marker detection and image-processing foundation"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          milestone = r'''# Milestone 6 — Notebook and Smart Page workflows

Status: **Complete — 2026-07-27**

## 6.1 Rust Notebook service

Implemented in `crates/a2d-core/src/milestone6.rs`, with typed persistence queries in
`crates/a2d-storage` and UniFFI projections in `crates/a2d-ffi/src/milestone6.rs`.

- [x] `resolve_notebook_setup_code`
- [x] `create_notebook`
- [x] `rename_notebook`
- [x] `archive_notebook`
- [x] `list_notebooks`
- [x] `get_notebook`
- [x] `set_active_notebook`
- [x] `get_active_notebook`

Rules:

- [x] Multiple notebooks may share one design. Each creation mints a fresh `NotebookId` and a
      separate set of persistent logical-page identities.
- [x] Names need not be unique. Persistence and lookup use typed IDs, not display names.
- [x] IDs are unique. Domain ID generation and database primary keys enforce identity uniqueness.
- [x] Active notebook is explicit persistent state. Migration 0003 adds a partial unique index so
      at most one non-archived notebook can be the active scan destination.
- [x] The UI never silently changes the active notebook. Selection and clearing are explicit user
      actions; conflicting page codes return a typed conflict result from Rust.

Notebook creation is transactional: the design, physical notebook, all logical page slots, and
optional active selection commit together or roll back together. Tests cover two physical copies of
one design, duplicate display names, active-selection persistence, archive behavior, and rollback.

## 6.2 Page resolution

`A2dCore::resolve_page_code` owns all identity and destination rules. Android passes decoded text to
Rust and renders the typed `PageResolution`; it does not reproduce the grammar or infer a notebook.

- [x] Resolve a Smart Page by unique ID.
- [x] Resolve a Notebook Page only through a matching Notebook Design.
- [x] Return `RequiresNotebookSelection` when multiple physical notebooks match and no notebook is
      explicitly confirmed.
- [x] Return `ConflictingActiveNotebook` when the confirmed/active notebook uses another design.
- [x] Return `ImportedUnknownSmartPage` for a valid but locally unknown Smart Page.
- [x] Never auto-create a physical notebook from an ordinary Page Code.
- [x] Return `RequiresNotebookRegistration` when the design is recognized but no physical notebook
      instance exists.
- [x] Return `UnsupportedCode` for Setup Codes used as page identifiers, unavailable designs,
      invalid logical page numbers, and incompatible layouts.

The result is projected through UniFFI without flattening the variants into untyped strings.
Domain, storage, core, and FFI tests exercise the resolved, ambiguous, conflicting, registration,
unknown-import, and unsupported paths.

## 6.3 Android Notebook UI

Implemented under `apps/android/app/src/main/kotlin/com/a2d/notebook/feature/notebook/`.

- [x] Add Notebook Setup Code scanner. The platform camera captures a bounded image, ZXing decodes
      QR text locally, and Rust performs canonical validation.
- [x] Notebook Design recognized screen.
- [x] Name/customize Notebook with optional color, icon, notes, and active-selection choice.
- [x] Created confirmation and first-page Page Code resolution action. Full-page camera capture
      remains correctly scoped to Milestones 8 and 9.
- [x] Unsupported/invalid Setup Code state remains visible as a typed Rust error.
- [x] Multiple-copy explanation and explicit “add another copy” path.
- [x] Active Notebook selector, clear action, rename, and archive controls.

`NotebookViewModel` contains only Android presentation state and dispatch. Every identity,
persistence, ambiguity, conflict, and creation rule delegates to `A2dClient` in Rust. Platform QR
capture failures are surfaced explicitly; they are not converted into successful scans.

## 6.4 Smart Page UI

Implemented under `apps/android/app/src/main/kotlin/com/a2d/notebook/feature/smartpage/`.

- [x] Create Smart Pages landing screen.
- [x] Single-page form.
- [x] Page-set form with a bounded 1–500 page count.
- [x] PDF preview using Android `PdfRenderer`.
- [x] Android print, Storage Access Framework save-copy, and content-URI share integration.
- [x] Generated page/set detail showing the Page Set ID and unique page-identity count.
- [x] Failed generation state with explicit retry. Retry invokes Rust generation again, so failed
      attempts never reuse an identity or pretend an incomplete output succeeded.

`SmartPagesViewModel` delegates generation, unique identity creation, PDF registration, and
validation to Rust. Android owns only form presentation, preview, and platform print/save/share.

Acceptance:

- [x] A user can register two identical physical notebook copies separately. The repeated setup
      flow and Rust tests prove separate `NotebookId` and page identities for one design.
- [x] A user can generate a unique Smart Page offline without an account. The complete path is
      local Rust + SQLite + private asset storage; no network or account service is invoked.

Final validation completed on 2026-07-27:

- `cargo fmt --all --check`
- `cargo clippy --workspace --all-targets --all-features -- -D warnings`
- `cargo test --workspace --all-features`
- `cargo deny check`
- Kotlin UniFFI regeneration and drift check
- Android lint and unit tests
- Android debug assembly
- Android NDK cross-build through `tools/build-android-native.sh`
'''
          text = text[:start] + milestone + text[end:]
          path.write_text(text)
          PY
          python3 /tmp/finalize_milestone6.py
          rm -f docs/MILESTONE6_FINAL_VALIDATION_FAILURE.md
          git rm .github/workflows/milestone6-android-apply.yml
          git rm docs/MILESTONE6_VALIDATION_PASS.md
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Milestone 6"
          git push origin HEAD:master
      - name: Commit final validation diagnostics
        if: steps.gates.outputs.status != '0' && steps.gates.outputs.status != 'skip'
        shell: bash
        run: |
          LOG="${{ steps.gates.outputs.log }}"
          git reset --hard origin/master
          {
            echo "# Milestone 6 final validation failure"
            echo
            echo '```text'
            tail -n 1600 "$LOG"
            echo '```'
          } > docs/MILESTONE6_FINAL_VALIDATION_FAILURE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MILESTONE6_FINAL_VALIDATION_FAILURE.md
          git commit -m "Record Milestone 6 final validation failure"
          git push origin HEAD:master
          exit 1
