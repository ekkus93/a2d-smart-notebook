name: Apply Milestone 6 Android v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/milestone6-android-apply.yml
      - tools/apply_milestone6_android.py

concurrency:
  group: milestone6-android-apply-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source, regenerate Kotlin bindings, and validate
        id: gates
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/milestone6-android-v3.log"
          (
            set -euo pipefail
            java -version
            cargo --version
            python3 tools/apply_milestone6_android.py
            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            cargo build -p a2d-ffi --lib
            rm -rf /tmp/a2d-m6-kotlin apps/android/app/src/main/kotlin/uniffi
            cargo run -p a2d-ffi --bin uniffi-bindgen -- generate \
              --library target/debug/liba2d_ffi.so \
              --language kotlin \
              --out-dir /tmp/a2d-m6-kotlin \
              --no-format
            mkdir -p apps/android/app/src/main/kotlin/uniffi/a2d_ffi
            cp /tmp/a2d-m6-kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
              apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            (cd apps/android && ./gradlew lint test assembleDebug --no-daemon --stacktrace)
          ) >"$LOG" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log=$LOG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated Android implementation
        if: steps.gates.outputs.status == '0'
        shell: bash
        run: |
          rm -f docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android docs/MILESTONE6_APPLY_STATUS.md
          if git diff --cached --quiet; then
            echo "No Android changes to commit"
          else
            git commit -m "Implement Milestone 6 Android workflows"
            git push origin HEAD:master
          fi
      - name: Publish failure diagnostics without broken source
        if: steps.gates.outputs.status != '0'
        shell: bash
        run: |
          LOG="${{ steps.gates.outputs.log }}"
          git reset --hard HEAD
          {
            echo "# Milestone 6 Android apply failure"
            echo
            echo '```text'
            tail -n 1000 "$LOG"
            echo '```'
          } > docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MILESTONE6_APPLY_STATUS.md
          git commit -m "Record Milestone 6 Android v3 failure"
          git push origin HEAD:master
          exit 1
