name: Publish FIX-001 Repair Status

on:
  workflow_run:
    workflows:
      - Apply FIX-001 PDF Source Repair
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  issues: write

concurrency:
  group: publish-fix001-repair-status
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish repair workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          jobs_file="${RUNNER_TEMP}/jobs.json"
          body_file="${RUNNER_TEMP}/body.md"
          patch_file="${RUNNER_TEMP}/patch.json"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" > "${jobs_file}"
          python3 - "${jobs_file}" "${body_file}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          jobs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("jobs", [])
          payload = {
              "workflow": "Apply FIX-001 PDF Source Repair",
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ["RUN_CONCLUSION"] or None,
              "head_sha": os.environ["HEAD_SHA"],
              "updated_at": os.environ["UPDATED_AT"],
              "jobs": [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "steps": [
                          {
                              "number": step.get("number"),
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }
                  for job in jobs
              ],
          }
          body = "\n".join([
              "<!-- maintained temporarily by publish-fix001-repair-status.yml -->",
              "# FIX-001 Repair Workflow Status",
              "",
              f'- **Status:** `{payload["status"]}`',
              f'- **Conclusion:** `{payload["conclusion"] or "pending"}`',
              f'- **Run:** [{payload["run_id"]}]({payload["run_url"]})',
              f'- **Commit:** `{payload["head_sha"]}`',
              f'- **Observed:** `{payload["updated_at"]}`',
              "",
              "```json",
              json.dumps(payload, indent=2, sort_keys=True),
              "```",
          ])
          Path(sys.argv[2]).write_text(body + "\n", encoding="utf-8")
          PY
          python3 - "${body_file}" "${patch_file}" <<'PY'
          import json
          import sys
          from pathlib import Path
          Path(sys.argv[2]).write_text(json.dumps({
              "title": "CI Status: Hosted Quality Gates",
              "body": Path(sys.argv[1]).read_text(encoding="utf-8"),
              "state": "open",
          }), encoding="utf-8")
          PY
          gh api --method PATCH "repos/${REPOSITORY}/issues/22" --input "${patch_file}" >/dev/null
