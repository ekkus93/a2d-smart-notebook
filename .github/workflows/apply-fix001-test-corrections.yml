name: Apply FIX-001 Test Corrections

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply FIX-001 test corrections'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct extensionless image and same-length tamper tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(before, after), encoding="utf-8")

          replace_once(
              "crates/a2d-core/src/milestone9_tests.rs",
              """    let corrected = image::open(&registered.corrected_path).unwrap();
              assert_eq!(corrected.dimensions(), (900, 1_273));
          """,
              """    let corrected_bytes = std::fs::read(&registered.corrected_path).unwrap();
              let corrected = image::load_from_memory(&corrected_bytes).unwrap();
              assert_eq!(corrected.dimensions(), (900, 1_273));
          """,
          )
          replace_once(
              "crates/a2d-core/src/scan_comparison.rs",
              """        std::fs::write(candidate_path, b"tampered").unwrap();
          """,
              """        let mut tampered_bytes = std::fs::read(&candidate_path).unwrap();
                  assert!(!tampered_bytes.is_empty());
                  tampered_bytes[0] ^= 0xff;
                  std::fs::write(candidate_path, tampered_bytes).unwrap();
          """,
          )
          Path(".github/workflows/apply-fix001-test-corrections.yml").unlink()
          PY
          cargo fmt --all
      - name: Commit corrected tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Correct asset verification regression tests"
          git push origin HEAD:master
