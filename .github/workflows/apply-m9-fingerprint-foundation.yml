name: Apply Milestone 9 fingerprint foundation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/apply-m9-fingerprint-foundation.py

permissions:
  contents: write

concurrency:
  group: apply-m9-fingerprint-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-test-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply fingerprint foundation
        run: |
          python tools/apply-m9-fingerprint-foundation.py
          cargo fmt
      - name: Run focused Rust verification
        run: |
          cargo test -p a2d-image --all-features
          cargo test -p a2d-core milestone9 --all-features
          cargo clippy -p a2d-image -p a2d-core --all-targets --all-features -- -D warnings
      - name: Commit verified foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-m9-fingerprint-foundation.py
          git rm .github/workflows/apply-m9-fingerprint-foundation.yml
          git add -A
          git commit -m "Add versioned scan perceptual fingerprints"
          git push origin "HEAD:${{ github.head_ref }}"
