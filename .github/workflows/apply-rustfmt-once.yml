name: Apply canonical rustfmt once

on:
  push:
    paths:
      - '.github/workflows/apply-rustfmt-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pinned Rust formatting
        run: cargo fmt
      - name: Commit canonical formatter output
        run: |
          if git diff --quiet -- '*.rs'; then
            echo 'No Rust formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply canonical Rust formatting'
          git push origin HEAD:master
