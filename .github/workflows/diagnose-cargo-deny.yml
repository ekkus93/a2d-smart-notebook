name: Temporary cargo-deny diagnostics

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned cargo-deny binary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin
          cargo-deny --version
      - name: Run cargo-deny and retain exact output
        id: deny
        continue-on-error: true
        run: |
          set -o pipefail
          NO_COLOR=1 cargo-deny check 2>&1 | tee cargo-deny.log
      - name: Commit exact diagnostic output
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          cp cargo-deny.log .github/tmp/cargo-deny-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/cargo-deny-diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record cargo-deny diagnostics [skip ci]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Upload cargo-deny output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Preserve cargo-deny failure
        if: steps.deny.outcome != 'success'
        run: exit 1
