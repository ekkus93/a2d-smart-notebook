name: Apply recovery delegates once

on:
  push:
    paths:
      - '.github/workflows/apply-quality-contract-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-recovery-delegates-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing repository delegates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'crates/a2d-storage/src/transaction_repository.rs',
              '''    fn get_scan(&self, id: &ScanId) -> Result<Option<Scan>, A2dError> {
                  ScanRepository::get_scan(&**self, id)
              }
          }
          ''',
              '''    fn get_scan(&self, id: &ScanId) -> Result<Option<Scan>, A2dError> {
                  ScanRepository::get_scan(&**self, id)
              }

              fn find_scan_by_recovery_token(
                  &self,
                  page_id: &PageId,
                  token: &str,
              ) -> Result<Option<Scan>, A2dError> {
                  ScanRepository::find_scan_by_recovery_token(&**self, page_id, token)
              }
          }
          ''',
          )
          replace_once(
              'crates/a2d-storage/src/lib.rs',
              '''            fn get_scan(
                          &self,
                          id: &a2d_domain::ScanId,
                      ) -> Result<Option<a2d_domain::Scan>, A2dError> {
                          ScanRepository::get_scan(&self.conn, id)
                      }
                  }
          ''',
              '''            fn get_scan(
                          &self,
                          id: &a2d_domain::ScanId,
                      ) -> Result<Option<a2d_domain::Scan>, A2dError> {
                          ScanRepository::get_scan(&self.conn, id)
                      }

                      fn find_scan_by_recovery_token(
                          &self,
                          page_id: &a2d_domain::PageId,
                          token: &str,
                      ) -> Result<Option<a2d_domain::Scan>, A2dError> {
                          ScanRepository::find_scan_by_recovery_token(&self.conn, page_id, token)
                      }
                  }
          ''',
          )
          Path('.github/workflows/apply-scanner-recovery-integration-once.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-quality-contract-once.yml').unlink(missing_ok=True)
          PY
          cargo fmt
          git diff --check
      - name: Commit recovery delegates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete scanner recovery repository delegation'
          git push origin HEAD:master
