name: Format Milestone 7 Fixture Test

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/format-milestone7-fixture-test.yml"

permissions:
  contents: read

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Validate fixture test
        id: validate
        continue-on-error: true
        run: |
          cargo clippy -p a2d-image --all-targets --all-features -- -D warnings > fixture-test-validation.log 2>&1
          cargo test -p a2d-image --all-features >> fixture-test-validation.log 2>&1
      - name: Upload formatted test and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-formatted-fixture-test
          path: |
            crates/a2d-image/tests/synthetic_scan_fixtures.rs
            fixture-test-validation.log
          if-no-files-found: error
      - name: Report validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          cat fixture-test-validation.log
          exit 1
