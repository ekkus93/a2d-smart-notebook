name: Apply Unit Test Coverage

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-unit-test-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.ref == 'agent/unit-test-coverage'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/unit-test-coverage
          fetch-depth: 0

      - name: Decode and apply implementation patches
        run: |
          base64 --decode tools/unit-test-coverage.patch.gz.b64 > "$RUNNER_TEMP/unit-test-coverage.patch.gz"
          gzip -dc "$RUNNER_TEMP/unit-test-coverage.patch.gz" > "$RUNNER_TEMP/unit-test-coverage.patch"
          git apply --check "$RUNNER_TEMP/unit-test-coverage.patch"
          git apply --whitespace=fix "$RUNNER_TEMP/unit-test-coverage.patch"
          git apply --check tools/unit-test-coverage-followup.patch
          git apply tools/unit-test-coverage-followup.patch

      - name: Format Rust code
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run dependency and license checks
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Commit validated implementation
        run: |
          rm -f tools/unit-test-coverage.patch.gz.b64
          rm -f tools/unit-test-coverage-followup.patch
          rm -f .github/workflows/apply-unit-test-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement unit test coverage TODO"
          git push origin HEAD:agent/unit-test-coverage
