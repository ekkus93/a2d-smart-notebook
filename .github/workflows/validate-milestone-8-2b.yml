name: Validate Milestone 8.2B

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  A2D_ANDROID_NDK_VERSION: "27.0.12077973"
  A2D_CARGO_NDK_VERSION: "4.1.2"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android native toolchain
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Build packaged x86_64 Rust library
        id: native
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./tools/build-android-native-libs.sh "x86_64" 2>&1 | tee native.log
      - name: Run Android lint, JVM tests, and APK assembly
        id: gradle
        if: steps.native.outcome == 'success'
        continue-on-error: true
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew lint test assembleDebug --no-daemon 2>&1 | tee ../../gradle.log
      - name: Enable KVM for the Android emulator
        if: steps.gradle.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run scanner presentation instrumentation tests
        id: emulator
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: >-
            cd apps/android &&
            ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.class=com.a2d.notebook.app.LiveScannerPresentationUiTest
            2>&1 | tee ../../emulator.log
      - name: Record validation failure
        if: >-
          steps.native.outcome != 'success' ||
          steps.gradle.outcome != 'success' ||
          steps.emulator.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          {
            echo "native=${{ steps.native.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "emulator=${{ steps.emulator.outcome }}"
            for log in native.log gradle.log emulator.log; do
              if test -f "$log"; then
                echo
                echo "===== $log ====="
                tail -n 400 "$log"
              fi
            done
          } > .github/tmp/milestone-8-2b-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/milestone-8-2b-validation.log
          git commit -m "Record Milestone 8.2B validation failure [skip ci]"
          git push origin HEAD:master
          exit 1
      - name: Remove one-use validation workflow
        if: >-
          steps.native.outcome == 'success' &&
          steps.gradle.outcome == 'success' &&
          steps.emulator.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-milestone-8-2b.yml
          git rm -f .github/tmp/milestone-8-2b-validation.log || true
          git commit -m "Complete Milestone 8.2B validation [skip ci]"
          git push origin HEAD:master
