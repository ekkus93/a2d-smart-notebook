name: Reconcile Milestone 7 evidence documentation

on:
  push:
    branches:
      - agent/milestone-7-native-validation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
          fetch-depth: 0

      - name: Apply assertion-checked documentation reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          todo = "docs/A2D_SMART_NOTEBOOK_V01_TODO.md"
          replace_exact(
              todo,
              """**Status:** Milestones 1–6 implemented; Milestone 7 is next  
          **Version:** 0.1  
          **Date:** 2026-07-27""",
              """**Status:** Milestones 1–6 complete; Milestone 7 implementation is complete except photographed Android fixtures and physical-device performance evidence  
          **Version:** 0.1  
          **Date:** 2026-07-28""",
          )
          replace_exact(
              todo,
              """- [ ] Fixture compatibility checks after fixtures exist. (No fixtures exist yet — blocked on
                ADR 0001 reaching Accepted, which needs Milestone 5's physical layout. Add this job when
                Milestone 4.3 lands.)""",
              """- [x] Fixture compatibility checks. Permanent CI regenerates the deterministic scan corpus,
                verifies manifest metadata and hashes, fails on byte drift, enforces versioned synthetic
                processing envelopes, runs Android ZXing conformance tests, and exercises the packaged shared
                Rust analysis path on an Android emulator.""",
          )
          replace_exact(
              todo,
              """- [ ] Measure detection on representative grayscale fixtures. A deterministic synthetic corpus now
                covers a canonical page plus rotation, perspective, exposure, blur, glare, missing-marker,
                wrong-layout, duplicate-marker, revision, and corrupt-input variants. Desktop tests detect and
                resolve the canonical page, but photographed fixtures and Android device-tier measurements are
                still required before this evidence gate is complete.""",
              """- [ ] Complete representative photographed-fixture and physical Android device-tier measurements.
                The deterministic synthetic corpus now has calibrated regression envelopes and runs through
                desktop Rust plus the packaged `x86_64` Android integration boundary. Photographed fixtures and
                physical `arm64-v8a` measurements remain required before this evidence gate is complete.""",
          )
          replace_exact(
              todo,
              """- [ ] Accept `docs/decisions/0002-apriltag-detector-selection.md`, naming the selected
                implementation and recording license review, Android ABI build results, desktop fixture
                results, performance measurements, the memory-safety boundary, packaging strategy, and
                future iOS feasibility. The ADR remains Proposed until representative fixtures, Android
                device measurements, final APK packaging, and third-party notices are proven.""",
              """- [ ] Accept `docs/decisions/0002-apriltag-detector-selection.md`, naming the selected
                implementation and recording license review, Android ABI build results, fixture results,
                performance measurements, the memory-safety boundary, packaging strategy, and future iOS
                feasibility. The ADR remains Proposed until representative photographed fixtures and physical
                Android device-tier performance measurements are committed. APK packaging, third-party notices,
                synthetic fixture envelopes, and emulator runtime loading are already proven.""",
          )
          replace_exact(
              todo,
              """- [ ] Add legally usable blur, rotation, scale, glare, and damage fixtures for the shipped decoder.
                The synthetic page corpus now contains valid A2D QR codes under rotation, blur, glare,
                perspective, exposure, wrong-layout, and corruption transforms, but Android ZXing conformance,
                explicit scale cases, and controlled QR damage cases are not yet implemented.""",
              """- [x] Add legally usable blur, rotation, scale, glare, distortion, and controlled-damage cases for
                the shipped ZXing decoder. Deterministic JVM conformance tests exercise pixel-buffer decoding
                separately from Android file I/O, while Rust remains the canonical payload trust boundary.""",
          )
          replace_exact(
              todo,
              """Validation evidence for the reconciled work:

          - GitHub Actions native run `30309797591` completed successfully on 2026-07-27.
          - GitHub Actions full CI run `30309797600` completed successfully on 2026-07-27.
          - Rust formatting, clippy with warnings denied, and the full workspace test suite passed.
          - Dependency/license checks passed.
          - Android lint, unit tests, and debug APK assembly passed.
          - Kotlin UniFFI binding-drift validation passed.
          - Pinned Android `arm64-v8a`/`x86_64` native builds and future Apple device/simulator compile checks
            passed.""",
              """Validation evidence for the reconciled work:

          - GitHub Actions native run `30326733326` completed successfully on 2026-07-28.
          - GitHub Actions full CI run `30326733320` completed successfully on 2026-07-28.
          - Android ZXing conformance tests cover scale, rotation, blur, glare, distortion, and controlled damage.
          - Rust formatting, clippy with warnings denied, the full workspace test suite, and dependency/license
            checks passed.
          - Android lint, unit tests, debug APK assembly, Kotlin UniFFI binding drift, both packaged native ABIs,
            detector linkage, and packaged notices passed verification.
          - Future Apple device/simulator compile-feasibility checks passed; no iOS application work is claimed.""",
          )
          replace_exact(
              todo,
              """- [ ] Add calibrated processing tolerances for each relevant fixture. Current CI enforces byte-exact asset
                regeneration plus exact discrete marker/decode expectations; it does not invent production quality
                thresholds or physical-camera tolerances.""",
              """- [x] Add calibrated processing tolerances for each relevant synthetic fixture. Versioned entries in
                `fixtures/scans/processing-expectations.tsv` enforce fixture-specific dimensions, luminance/focus
                ranges, detector counts and IDs, decision-margin/Hamming bounds, and explicit resolution/error
                behavior. These are deterministic synthetic regression envelopes, not production quality thresholds
                or physical-camera tolerances.""",
          )
          replace_exact(
              todo,
              """- [ ] Android calls the same shared processing path. This remains a Milestone 8 integration task.""",
              """- [x] Android calls the same shared processing path. An Android instrumentation test reads the canonical
                synthetic PNG from the test APK and executes the typed Kotlin façade, generated UniFFI/JNA binding,
                packaged `x86_64` Rust library, bounded decoder, Gray8 conversion, official AprilTag detector,
                semantic marker resolution, and quality measurement without mocked detector results.""",
          )
          replace_exact(
              todo,
              """Validation evidence:

          - GitHub Actions native/fixture run `30315949013` passed deterministic regeneration and byte-drift
            comparison, fixture clippy/tests, pinned Android `arm64-v8a`/`x86_64` native builds, and future Apple
            compile-feasibility checks.
          - GitHub Actions full CI run `30315948996` passed workspace formatting/clippy/tests,
            dependency/license checks, Android lint/tests/debug APK assembly, and Kotlin binding drift.

          ---

          # Milestone 8 — CameraX scanning""",
              """Validation evidence:

          - GitHub Actions native/fixture run `30326733326` passed deterministic regeneration and byte-drift
            comparison, synthetic processing envelopes, raw-measurement artifact generation, pinned Android
            `arm64-v8a`/`x86_64` native builds, and future Apple compile-feasibility checks.
          - GitHub Actions full CI run `30326733320` passed workspace formatting/clippy/tests,
            dependency/license checks, Android lint/tests/debug APK assembly, Kotlin binding drift, APK native
            ABI/linkage/notices verification, and the packaged shared-Rust Android emulator integration test.

          Remaining Milestone 7 evidence:

          - [ ] Commit real photographed Android fixtures with source/consent/license and device/capture metadata.
          - [ ] Record representative physical `arm64-v8a` runtime, latency, and memory measurements across the
                supported Android device tiers.
          - [ ] Recalibrate any production capture policy only from physical evidence; do not promote synthetic
                regression envelopes into production thresholds.
          - [ ] Move ADR 0002 to Accepted after the physical evidence gates above pass.

          ---

          # Milestone 8 — CameraX scanning""",
          )

          adr = "docs/decisions/0002-apriltag-detector-selection.md"
          replace_exact(
              adr,
              """**Status:** Proposed — official detector selected; native portability confirmed; fixture and packaging evidence pending  """,
              """**Status:** Proposed — official detector selected; synthetic/runtime/packaging evidence complete; physical-device evidence pending  """,
          )
          replace_exact(
              adr,
              """The first Milestone 7 implementation uses `apriltag-sys = 0.4.0` to compile the bundled official AprilTag C source and exposes a narrow safe Rust API from `a2d-image`. Pinned CI validation now confirms the desktop detector path, both required Android ABIs, and future iOS device/simulator compile feasibility. This ADR remains Proposed because representative photographed fixtures, device-tier performance measurements, final APK packaging, and release notices are still incomplete.""",
              """The Milestone 7 implementation uses `apriltag-sys = 0.4.0` to compile the bundled official AprilTag C source and exposes a narrow safe Rust API from `a2d-image`. Pinned CI now confirms the desktop detector path, both required Android ABIs, future iOS device/simulator compile feasibility, deterministic synthetic regression envelopes, final APK packaging and notices, and packaged `x86_64` execution through the Android UniFFI/JNA boundary. This ADR remains Proposed only because representative photographed fixtures and physical Android device-tier performance measurements are still incomplete.""",
          )
          replace_exact(
              adr,
              """- Final Android application packaging still must be proven.""",
              """- Final APK packaging is proven for `arm64-v8a` and `x86_64`; physical `arm64-v8a` runtime and device-tier performance still must be proven.""",
          )
          replace_exact(
              adr,
              """4. performance evidence is recorded from representative fixtures and target Android device tiers — **pending**; and
          5. final APK packaging and third-party notice obligations are demonstrated — **pending**.""",
              """4. performance evidence is recorded from representative photographed fixtures and target physical Android device tiers — **pending**; and
          5. final APK packaging and third-party notice obligations are demonstrated — **complete**.""",
          )
          replace_exact(
              adr,
              """## Compatibility/fixture implications

          The detector test renders four `tagStandard41h12` tags through the same official library, places them into a generated grayscale frame, detects them, resolves semantic roles, and verifies orientation and quality fields.

          In run `30308722258`, that generated four-tag frame was detected in `9.505117 ms` on the GitHub-hosted desktop runner. This is a deterministic smoke measurement, not a representative Android-device benchmark and not an auto-capture threshold.

          The generated test is necessary but not sufficient. Milestone 7 still requires legally usable photographed, blur, glare, missing-marker, wrong-layout, duplicate, revision, and corrupted fixtures with explicit source/license metadata and tolerances.

          Changing detector implementation or family after those fixtures are committed will require explicit compatibility review and may require re-deriving tolerances.""",
              """## Compatibility/fixture implications

          The deterministic corpus contains a content-bearing canonical notebook page plus rotation, perspective, exposure, blur, glare, missing-marker, wrong-layout, wrong-tag-set, duplicate-marker, revision, truncated-image, and non-image controls. It uses the pinned official `tagStandard41h12` renderer and canonical Rust Page Code encoder rather than reimplementing either format in Python.

          Versioned synthetic processing envelopes in `fixtures/scans/processing-expectations.tsv` constrain dimensions, raw luminance/focus measurements, detector counts and IDs, decision margins, Hamming errors, and explicit resolution/error behavior. These envelopes prevent regression drift; they are not physical-camera tolerances, Android performance targets, or production auto-capture policy.

          GitHub Actions native run `30326733326` regenerated the corpus byte-for-byte, enforced the processing envelopes, emitted raw measurements, built both Android ABIs, and confirmed future Apple compile feasibility. Full CI run `30326733320` exercised the canonical PNG through the packaged `x86_64` Android library and typed UniFFI/JNA boundary.

          Representative photographed captures remain necessary before this decision can be Accepted. Changing detector implementation or family after those fixtures are committed will require explicit compatibility review and may require re-deriving tolerances.""",
          )
          replace_exact(
              adr,
              """Both `apriltag-sys 0.4.0` and the bundled official AprilTag source use BSD-2-Clause terms compatible with the Apache-2.0 A2D project. Binary distribution must reproduce the required notices and disclaimer. Release packaging must include third-party notices before an APK is distributed.""",
              """Both `apriltag-sys 0.4.0` and the bundled official AprilTag source use BSD-2-Clause terms compatible with the Apache-2.0 A2D project. Binary distribution must reproduce the required notices and disclaimer. The verified debug APK now includes the required third-party notices and the project Apache-2.0 license; permanent CI rejects absent or mismatched notice/license assets.""",
          )
          replace_exact(
              adr,
              """- Physical fixture thresholds remain unmeasured and cannot yet drive auto-capture policy.
          - Successful library cross-compilation does not prove final APK packaging or runtime loading.""",
              """- Physical fixture thresholds remain unmeasured and cannot yet drive auto-capture policy.
          - APK structure and packaged `x86_64` runtime loading are proven, but physical `arm64-v8a` loading,
            latency, and memory behavior remain unmeasured.""",
          )
          replace_exact(
              adr,
              """- [ ] Representative photographed fixture results committed.
          - [ ] Performance measurements recorded for representative fixture/device tiers.
          - [ ] Final Android packaging into the application APK demonstrated.
          - [ ] Third-party notices included in release packaging.""",
              """- [x] Deterministic synthetic fixture results and versioned regression envelopes committed.
          - [x] Packaged shared-Rust analysis executed successfully on an Android `x86_64` emulator.
          - [ ] Representative photographed fixture results committed.
          - [ ] Performance measurements recorded for representative physical device tiers.
          - [x] Final Android packaging into the application APK demonstrated for `arm64-v8a` and `x86_64`.
          - [x] Third-party notices and the project license included and verified in APK packaging.""",
          )
          replace_exact(
              adr,
              """1. Create the Milestone 7 fixture corpus and metadata format.
          2. Add photographed/perturbed detector fixtures and tolerance assertions.
          3. Measure representative analysis latency on supported Android device tiers.
          4. Demonstrate `a2d-image`/AprilTag packaging and runtime loading in the Android APK when the shared analysis path reaches `a2d-ffi`.
          5. Add required BSD-2-Clause notices to release packaging before distribution.
          6. Expose the validated analysis path through `a2d-core`/UniFFI when Milestone 8 CameraX integration begins.
          7. Move this ADR to Accepted only after the remaining required evidence is committed.
          8. Update `docs/decisions/README.md` when the status changes.""",
              """1. Commit representative photographed Android fixtures with source/consent/license and device/capture metadata.
          2. Add physical-fixture tolerance assertions without converting synthetic envelopes into production thresholds.
          3. Prove packaged `arm64-v8a` runtime loading and measure representative latency and memory behavior on supported Android device tiers.
          4. Move this ADR to Accepted only after the remaining physical evidence is committed.
          5. Update `docs/decisions/README.md` when the status changes.""",
          )
          PY

      - name: Commit reconciled documentation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-milestone7-docs.yml
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md docs/decisions/0002-apriltag-detector-selection.md
          git diff --cached --check
          git commit -m "Reconcile Milestone 7 validation evidence"
          git push origin HEAD:agent/milestone-7-native-validation
