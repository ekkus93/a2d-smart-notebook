name: Validate Milestone 7 Quality Metrics

on:
  pull_request:
    paths:
      - "crates/a2d-image/**"
      - ".github/workflows/validate-milestone7-quality.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/milestone-7-native-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Run clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p a2d-image --all-targets --all-features -- -D warnings > quality-validation.log 2>&1
      - name: Run tests
        id: tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        run: cargo test -p a2d-image --all-features >> quality-validation.log 2>&1
      - name: Upload formatted sources and validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-quality-validation
          path: |
            crates/a2d-image/src
            quality-validation.log
          if-no-files-found: error
      - name: Report validation failure
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          cat quality-validation.log
          exit 1
      - name: Verify formatting touched only Rust source
        run: |
          unexpected=$(git diff --name-only | grep -v '^crates/a2d-image/src/.*\.rs$' || true)
          test -z "$unexpected" || {
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          }
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-image/src
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "Format and validate Milestone 7 quality metrics"
          git push origin HEAD:${{ github.head_ref }}
