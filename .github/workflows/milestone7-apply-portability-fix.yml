name: Apply Milestone 7 Portability Fix

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/milestone7-apply-portability-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 tools/apply-milestone7-native-boolean-fix.py
      - name: Validate patch shape
        run: |
          git diff --check
          grep -F 'native.refine_edges = NativeBoolean::from_bool(config.refine_edges);' crates/a2d-image/src/detector.rs
          grep -F 'native.debug = NativeBoolean::from_bool(false);' crates/a2d-image/src/detector.rs
      - name: Remove one-shot patch machinery
        run: |
          rm tools/apply-milestone7-native-boolean-fix.py
          rm .github/workflows/milestone7-apply-portability-fix.yml
      - name: Commit portability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-image/src/detector.rs tools/apply-milestone7-native-boolean-fix.py .github/workflows/milestone7-apply-portability-fix.yml
          git commit -m "Fix AprilTag native boolean portability"
          git push origin HEAD:agent/milestone-7-native-validation
