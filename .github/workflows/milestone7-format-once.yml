name: Format Milestone 7 Portability Fix

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/milestone7-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
          fetch-depth: 0
      - name: Format Rust source
        run: cargo fmt --all
      - name: Validate formatted diff
        run: |
          cargo fmt --all --check
          git diff --check
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/milestone7-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-image/src/detector.rs .github/workflows/milestone7-format-once.yml
          git commit -m "Format AprilTag portability fix"
          git push origin HEAD:agent/milestone-7-native-validation
