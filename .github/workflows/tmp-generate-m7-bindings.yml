name: Temporary Milestone 7 Generated Files Commit

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/tmp-generate-m7-bindings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-m7-generated-files-commit
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Generate exact binding, lockfile, and Rust formatting
        run: |
          bash ./tools/build-android-native.sh "x86_64"
          cargo fmt
      - name: Commit generated outputs only
        run: |
          git add \
            Cargo.lock \
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
            crates/a2d-image/tests/synthetic_processing_expectations.rs
          if git diff --cached --quiet; then
            echo "Generated outputs already match the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Milestone 7 generated files"
          git pull --rebase origin agent/milestone-7-native-validation
          git push origin HEAD:agent/milestone-7-native-validation
