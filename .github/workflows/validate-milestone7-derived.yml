name: Validate Milestone 7 Derived Images

on:
  pull_request:
    paths:
      - "crates/a2d-image/**"
      - ".github/workflows/validate-milestone7-derived.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/milestone-7-native-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Narrow sharpening helper to a mutable slice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/a2d-image/src/derived.rs")
          text = path.read_text()
          old = """fn sharpen_gray_in_place(
    bytes: &mut Vec<u8>,
    width: u32,
    height: u32,
    config: SharpenConfig,
) -> Result<(), A2dError> {
"""
          new = """fn sharpen_gray_in_place(
    bytes: &mut [u8],
    width: u32,
    height: u32,
    config: SharpenConfig,
) -> Result<(), A2dError> {
"""
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("sharpen helper signature anchor not found")
              text = text.replace(old, new, 1)
          text = text.replace("    let original = bytes.clone();\n", "    let original = bytes.to_vec();\n", 1)
          path.write_text(text)
          PY
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Run clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p a2d-image --all-targets --all-features -- -D warnings > derived-validation.log 2>&1
      - name: Run tests
        id: tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        run: cargo test -p a2d-image --all-features >> derived-validation.log 2>&1
      - name: Upload formatted sources and validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-derived-validation
          path: |
            crates/a2d-image/src
            derived-validation.log
          if-no-files-found: error
      - name: Report validation failure
        if: steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          cat derived-validation.log
          exit 1
      - name: Verify changes are limited to Rust source
        run: |
          unexpected=$(git diff --name-only | grep -v '^crates/a2d-image/src/.*\.rs$' || true)
          test -z "$unexpected" || {
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          }
      - name: Commit verified derived image source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-image/src
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Format and validate Milestone 7 derived images"
          git push origin HEAD:${{ github.head_ref }}
