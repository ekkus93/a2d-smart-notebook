name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify photographed fixture metadata
        run: |
          python -m unittest discover -s tools/tests -p 'test_verify_photographed_scan_fixtures.py'
          python tools/verify_photographed_scan_fixtures.py
      # rust-toolchain.toml pins the compiler plus rustfmt and clippy.
      - name: Show resolved toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Generate canonical Rust formatting
        run: cargo fmt
      - name: Upload exact rustfmt output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            crates/a2d-ffi/src/milestone7.rs
            crates/a2d-image/src/bin/a2d_fixture_measurements.rs
            crates/a2d-image/src/bin/a2d_fingerprint_calibration.rs
            crates/a2d-image/tests/synthetic_processing_expectations.rs
          if-no-files-found: error
      - name: Fail if Rust formatting drifted
        run: git diff --exit-code -- '*.rs'
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace --all-features
        # Also exercises Kotlin and Swift UniFFI generation contract checks.
        run: cargo test --workspace --all-features

  deny:
    name: cargo deny (dependency/license checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android:
    name: Android (native ABIs, lint, test, APK verification)
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Build shared Rust libraries and generate Kotlin UniFFI binding
        run: bash ./tools/build-android-native.sh "arm64-v8a x86_64"
      - name: Gradle lint, unit tests, and debug APK
        working-directory: apps/android
        run: ./gradlew lint test assembleDebug --no-daemon
      - name: Verify APK native libraries, detector linkage, production symbols, and notices
        run: >-
          python tools/verify-android-apk.py
          apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a2d-verified-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-shared-analysis:
    name: Android emulator (scanner, recovery, FFI panic containment)
    needs: android
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Prepare CI-only feature-enabled FFI panic test build
        run: bash ./tools/prepare-android-ffi-panic-test.sh
      - name: Run scanner, recovery, panic-containment, scan-revision, and Needs Review tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: >-
            cd apps/android &&
            ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.class=com.a2d.notebook.app.SharedPageAnalysisTest,com.a2d.notebook.app.LiveScannerPresentationUiTest,com.a2d.notebook.app.QrCaptureRecoveryTest,com.a2d.notebook.app.ScannerRecoveryBridgeTest,com.a2d.notebook.app.GeneratedPdfAssetValidationTest,com.a2d.notebook.app.PanicPropagationTest,com.a2d.notebook.app.ScanRevisionBridgeIntegrationTest,com.a2d.notebook.app.NeedsReviewBridgeIntegrationTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shared-analysis-results
          path: |
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  android-binding-drift:
    # Keep this job id/name stable for existing required-check configuration. The binding is now
    # generated build output, so the check proves generation + untracked policy instead of diffing
    # a stale checked-in copy.
    name: Kotlin UniFFI binding generation drift check
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Regenerate native library and Kotlin binding
        run: bash ./tools/build-android-native.sh "x86_64"
      - name: Verify generated binding is complete and untracked
        run: |
          binding="apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt"
          test -s "$binding"
          grep -q 'getScanRevisionProposal' "$binding"
          grep -q 'resolveScanRevision' "$binding"
          grep -q 'listReviewItems' "$binding"
          grep -q 'resolveReviewItem' "$binding"
          grep -q 'deferReviewItem' "$binding"
          git check-ignore -q "$binding"
          if git ls-files --error-unmatch "$binding" >/dev/null 2>&1; then
            echo "Generated Kotlin UniFFI binding must not be committed" >&2
            exit 1
          fi
          git diff --exit-code -- Cargo.lock
      - name: Upload exact generated files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-android-ffi-files
          path: |
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            Cargo.lock
          if-no-files-found: error
