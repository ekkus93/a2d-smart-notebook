name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-camerax-todo:
    name: Reconcile CameraX milestone status
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Update the authoritative TODO
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("docs/A2D_SMART_NOTEBOOK_V01_TODO.md")
          text = path.read_text(encoding="utf-8")

          status = (
              "**Status:** Milestones 1–6 complete; Milestone 7 implementation is complete except "
              "photographed Android fixtures and physical-device performance evidence; Milestone "
              "8.1 CameraX adapter complete  "
          )
          text, replacements = re.subn(
              r"^\*\*Status:\*\*.*$",
              status,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("could not replace the authoritative status line")

          start_marker = "## 8.1 Camera adapter\n"
          end_marker = "## 8.2 Live Rust/native analysis\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("could not locate the bounded Milestone 8.1 section")

          replacement = """## 8.1 Camera adapter

- [x] CameraX preview. `CameraPreviewSurface` hosts `PreviewView` in Compose and binds only after
      view attachment so initial display rotation is authoritative without a delayed callback that
      can outlive disposal.
- [x] Image analysis. `CameraXAdapter` binds a YUV `ImageAnalysis` use case and emits owned,
      tightly packed luminance frames through explicit success/failure events.
- [x] Full-resolution capture. `ImageCapture` writes only to a caller-selected new staging file;
      existing files are rejected rather than overwritten silently.
- [x] Correct lifecycle binding. Preview, analysis, and capture bind together through
      `bindToLifecycle`; disposal and lifecycle destruction invalidate stale work, clear the
      analyzer, unbind use cases, and close the analysis executor.
- [x] Permission-denied handling. The Compose permission state distinguishes not requested,
      retryable denial, permanent denial, and granted states, with an explicit application-settings
      action.
- [x] Background/foreground recovery. CameraX lifecycle binding owns stop/start transitions, while
      permission state is refreshed on lifecycle resume.
- [x] Rotation handling. Preview, analysis, and capture target rotations are validated and updated
      together; invalid rotations surface an explicit adapter error.
- [x] Torch control where available. Torch requests reject absent flash hardware explicitly and
      stale asynchronous completions cannot publish state after rebind or closure.
- [x] Bounded analysis backpressure. Analysis uses `STRATEGY_KEEP_ONLY_LATEST` on a dedicated
      single-thread executor.
- [x] Reliably close every frame. Every `ImageProxy` is closed on success and recoverable failure;
      fatal JVM errors propagate only after frame closure. Unit tests cover row/pixel stride, crop,
      source buffer limits, ordinary failures, close failures, and fatal-error propagation.

Validation evidence:

- GitHub Actions CameraX adapter run `30339511067` passed workspace formatting/clippy/tests,
  permanent printable QR/page compatibility regeneration, both packaged Android native-library
  ABIs, Android lint and JVM tests, debug APK assembly, and APK native packaging verification.
- This completes only the platform adapter in Milestone 8.1. Live shared-Rust analysis, latency
  measurement, stale native-work cancellation, overlays/guidance, and auto-capture remain in
  Milestones 8.2 and 8.3; physical printer/camera and representative Android-device evidence also
  remain open.

"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Restore CI and commit the reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml docs/A2D_SMART_NOTEBOOK_V01_TODO.md
          git diff --cached --check
          git commit -m "Reconcile CameraX adapter milestone status [skip ci]"
          git push origin HEAD:master

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler plus rustfmt and clippy.
      - name: Show resolved toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Generate canonical Rust formatting
        run: cargo fmt
      - name: Upload exact rustfmt output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            crates/a2d-ffi/src/milestone7.rs
            crates/a2d-image/src/bin/a2d_fixture_measurements.rs
            crates/a2d-image/tests/synthetic_processing_expectations.rs
          if-no-files-found: error
      - name: Fail if Rust formatting drifted
        run: git diff --exit-code -- '*.rs'
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace --all-features
        # Also exercises Kotlin and Swift UniFFI generation smoke checks.
        run: cargo test --workspace --all-features

  deny:
    name: cargo deny (dependency/license checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android:
    name: Android (native ABIs, lint, test, APK verification)
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Build the shared Rust library for packaged Android ABIs
        run: bash ./tools/build-android-native-libs.sh "arm64-v8a x86_64"
      - name: Gradle lint, unit tests, and debug APK
        working-directory: apps/android
        run: ./gradlew lint test assembleDebug --no-daemon
      - name: Verify APK native libraries, detector linkage, and notices
        run: >-
          python tools/verify-android-apk.py
          apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a2d-verified-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-shared-analysis:
    name: Android emulator (packaged shared Rust analysis)
    needs: android
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Build the packaged x86_64 Rust library
        run: bash ./tools/build-android-native-libs.sh "x86_64"
      - name: Run the shared-analysis instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: >-
            cd apps/android &&
            ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.class=com.a2d.notebook.app.SharedPageAnalysisTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shared-analysis-results
          path: |
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  android-binding-drift:
    name: Kotlin UniFFI binding generation drift check
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Regenerate the native library and Kotlin bindings
        run: bash ./tools/build-android-native.sh "x86_64"
      - name: Upload exact generated files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-android-ffi-files
          path: |
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            Cargo.lock
          if-no-files-found: error
      - name: Fail if generated files drifted from what is committed
        run: >-
          git diff --exit-code --
          apps/android/app/src/main/kotlin/uniffi/
          Cargo.lock
