name: CI

# TODO 1.3 / spec section 31's required gates. "Fixture compatibility checks after fixtures
# exist" is deliberately not a job here yet -- no fixtures exist (fixtures/qr/v1/ is blocked on
# ADR 0001 reaching Accepted); add that job when Milestone 4.3 lands.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No explicit toolchain-install action: rust-toolchain.toml pins 1.94.1 with the rustfmt
      # and clippy components, and rustup (preinstalled on GitHub's runners) auto-installs both
      # the first time cargo/rustc runs inside the checkout.
      - name: Show resolved toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace --all-features
        # Also exercises crates/a2d-ffi/tests/binding_generation.rs, which regenerates and
        # asserts on both Kotlin and Swift bindings from the desktop build -- this is TODO 1.3's
        # "Swift UniFFI binding generation smoke check," not a separate job.
        run: cargo test --workspace --all-features

  deny:
    name: cargo deny (dependency/license checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android:
    name: Android (lint, test, assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: gradlew lint test assembleDebug
        working-directory: apps/android
        run: ./gradlew lint test assembleDebug --no-daemon

  android-binding-drift:
    name: Kotlin UniFFI binding generation drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the Android Rust target
        run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Normalize ANDROID_SDK_ROOT (tools/build-android-native.sh's NDK auto-detection needs it)
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
      - name: Install the Android NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          cargo install cargo-ndk --locked
      - name: Regenerate the native lib and Kotlin bindings
        run: ./tools/build-android-native.sh
      - name: Fail if the generated bindings drifted from what's committed
        run: git diff --exit-code -- apps/android/app/src/main/kotlin/uniffi/
