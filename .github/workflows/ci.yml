name: One-shot Milestone 6 TODO reconciliation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile TODO
        run: python3 tools/reconcile_milestone6_todo.py
      - name: Commit documentation and restore permanent CI
        shell: bash
        run: |
          set -euo pipefail
          git show cdf9720b5997a762533b3ecce7c7fee5bc204787:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm tools/reconcile_milestone6_todo.py
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile Milestone 6 TODO completion"
          git push origin HEAD:master
