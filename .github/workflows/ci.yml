name: CI

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fix022:
    name: Apply FIX-022 exact patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source and test patch
        run: python3 tools/apply_fix022.py

      - name: Commit FIX-022 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-core/src/milestone9.rs crates/a2d-core/src/milestone9_tests.rs
          git diff --cached --check
          git commit -m "Normalize generic scan rollback evidence"
          git push origin HEAD:master
