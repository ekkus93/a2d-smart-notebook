name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fix022:
    name: Apply FIX-022 exact patch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and apply exact patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-fix022-scan-rollback.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          code_lines = []
          for line in lines[start:end]:
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded patch indentation: {line!r}')
              code_lines.append(line[10:])
          Path('/tmp/apply_fix022.py').write_text('\n'.join(code_lines) + '\n')
          PY
          python3 /tmp/apply_fix022.py
      - name: Commit FIX-022 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-core/src/milestone9.rs crates/a2d-core/src/milestone9_tests.rs
          git diff --cached --check
          git commit -m "Normalize generic scan rollback evidence"
          git push origin HEAD:master

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify photographed fixture metadata
        run: |
          python -m unittest discover -s tools/tests -p 'test_verify_photographed_scan_fixtures.py'
          python tools/verify_photographed_scan_fixtures.py
      # rust-toolchain.toml pins the compiler plus rustfmt and clippy.
      - name: Show resolved toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Generate canonical Rust formatting
        run: cargo fmt
      - name: Upload exact rustfmt output for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            crates/a2d-ffi/src/milestone7.rs
            crates/a2d-image/src/bin/a2d_fixture_measurements.rs
            crates/a2d-image/src/bin/a2d_fingerprint_calibration.rs
            crates/a2d-image/tests/synthetic_processing_expectations.rs
          if-no-files-found: error
      - name: Fail if Rust formatting drifted
        run: git diff --exit-code -- '*.rs'
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test --workspace --all-features
        # Also exercises Kotlin and Swift UniFFI generation smoke checks.
        run: cargo test --workspace --all-features

  deny:
    name: cargo deny (dependency/license checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  android:
    name: Android (native ABIs, lint, test, APK verification)
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Build the shared Rust library for packaged Android ABIs
        run: bash ./tools/build-android-native-libs.sh "arm64-v8a x86_64"
      - name: Gradle lint, unit tests, and debug APK
        working-directory: apps/android
        run: ./gradlew lint test assembleDebug --no-daemon
      - name: Verify APK native libraries, detector linkage, production symbols, and notices
        run: >-
          python tools/verify-android-apk.py
          apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a2d-verified-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-shared-analysis:
    name: Android emulator (scanner, recovery, FFI panic containment)
    needs: android
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Prepare CI-only feature-enabled FFI panic test build
        run: bash ./tools/prepare-android-ffi-panic-test.sh
      - name: Run scanner, recovery, and panic-containment tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: >-
            cd apps/android &&
            ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.class=com.a2d.notebook.app.SharedPageAnalysisTest,com.a2d.notebook.app.LiveScannerPresentationUiTest,com.a2d.notebook.app.QrCaptureRecoveryTest,com.a2d.notebook.app.GeneratedPdfAssetValidationTest,com.a2d.notebook.app.PanicPropagationTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shared-analysis-results
          path: |
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  android-binding-drift:
    name: Kotlin UniFFI binding generation drift check
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Regenerate the native library and Kotlin bindings
        run: bash ./tools/build-android-native.sh "x86_64"
      - name: Upload exact generated files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-android-ffi-files
          path: |
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            Cargo.lock
          if-no-files-found: error
      - name: Fail if generated files drifted from what is committed
        run: >-
          git diff --exit-code --
          apps/android/app/src/main/kotlin/uniffi/
          Cargo.lock
