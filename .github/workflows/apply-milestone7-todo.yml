name: Apply Milestone 7 TODO Reconciliation

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/apply-milestone7-todo.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
      - name: Reconcile documented Milestone 7 evidence
        run: python3 tools/reconcile-milestone7-todo.py
      - name: Verify only the TODO changed
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "docs/A2D_SMART_NOTEBOOK_V01_TODO.md"
      - name: Commit reconciled checklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md
          git commit -m "Reconcile Milestone 7 implementation status"
          git push origin HEAD:agent/milestone-7-native-validation
