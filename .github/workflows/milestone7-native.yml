name: Milestone 7 Native Validation

on:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "crates/a2d-image/**"
      - "fixtures/scans/**"
      - "tools/generate_scan_fixtures.py"
      - "tools/scan-fixtures-requirements.txt"
      - "tools/verify_scan_fixtures.py"
      - "tools/validate-milestone7-native.sh"
      - ".github/workflows/milestone7-native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone7-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-fixture-docs:
    name: Reconcile Milestone 7.8 fixture documentation
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/milestone-7-native-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply evidence-backed checklist update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/A2D_SMART_NOTEBOOK_V01_TODO.md")
          text = path.read_text(encoding="utf-8")

          old_detector = '''- [ ] Measure detection on representative grayscale fixtures. The generated four-tag smoke test is
                deterministic, but photographed/perturbed fixtures and Android device-tier measurements are
                still required.
          '''
          new_detector = '''- [ ] Measure detection on representative grayscale fixtures. A deterministic synthetic corpus now
                covers a canonical page plus rotation, perspective, exposure, blur, glare, missing-marker,
                wrong-layout, duplicate-marker, revision, and corrupt-input variants. Desktop tests detect and
                resolve the canonical page, but photographed fixtures and Android device-tier measurements are
                still required before this evidence gate is complete.
          '''
          if text.count(old_detector) != 1:
              raise SystemExit("Milestone 7.1 detector fixture anchor not found exactly once")
          text = text.replace(old_detector, new_detector, 1)

          old_qr = '''- [ ] Add legally usable blur, rotation, scale, glare, and damage fixtures for the shipped decoder.
          '''
          new_qr = '''- [ ] Add legally usable blur, rotation, scale, glare, and damage fixtures for the shipped decoder.
                The synthetic page corpus now contains valid A2D QR codes under rotation, blur, glare,
                perspective, exposure, wrong-layout, and corruption transforms, but Android ZXing conformance,
                explicit scale cases, and controlled QR damage cases are not yet implemented.
          '''
          if text.count(old_qr) != 1:
              raise SystemExit("Milestone 7.4 QR fixture anchor not found exactly once")
          text = text.replace(old_qr, new_qr, 1)

          old_section = '''## 7.8 Fixture corpus

          Create legally usable fixtures under:

          ```text
          fixtures/scans/
          ├── generated/
          ├── photographed/
          ├── glare/
          ├── blur/
          ├── missing-marker/
          ├── wrong-layout/
          ├── duplicate/
          ├── revisions/
          └── corrupted/
          ```

          Every fixture records source/license, expected identity, quality state, marker roles, warnings, and tolerances.

          Acceptance:

          - [ ] A desktop Rust test/CLI processes fixtures without Android.
          - [ ] Android calls the same shared processing path.
          '''
          new_section = '''## 7.8 Fixture corpus

          The deterministic synthetic foundation is committed under:

          ```text
          fixtures/scans/
          ├── generated/
          ├── photographed/
          ├── glare/
          ├── blur/
          ├── missing-marker/
          ├── wrong-layout/
          ├── duplicate/
          ├── revisions/
          └── corrupted/
          ```

          - [x] Generate a content-bearing notebook page with the pinned official `tagStandard41h12` marker
                family and a canonical A2D Notebook Page QR payload. The fixture-only Rust helper renders the
                official tags and uses the existing `PageCode` encoder; Python does not reimplement either wire
                format.
          - [x] Generate deterministic rotation, perspective, underexposure, overexposure, Gaussian blur,
                localized glare, missing-marker, wrong-layout QR, wrong marker-set, duplicate-marker, revision,
                truncated-image, and non-image controls with pinned Pillow `11.3.0`.
          - [x] Record project-generated/Apache-2.0 provenance, expected QR identity, expected marker roles,
                intended quality state, warnings, transformation parameters, dimensions, mode, byte length, and
                SHA-256 in `fixtures/scans/manifest.json`.
          - [x] Keep `fixtures/scans/photographed/` separate and protected from synthetic regeneration. Synthetic
                controls never claim photographed provenance.
          - [x] Verify every manifest entry, digest, dimension, decode-success/decode-failure expectation, category,
                and provenance field through `tools/verify_scan_fixtures.py`.
          - [x] Regenerate the corpus in read-only CI and compare every generated category plus the manifest
                byte-for-byte against committed assets so generator drift fails explicitly.
          - [ ] Add calibrated processing tolerances for each relevant fixture. Current CI enforces byte-exact asset
                regeneration plus exact discrete marker/decode expectations; it does not invent production quality
                thresholds or physical-camera tolerances.
          - [ ] Add real photographed Android fixtures with source/consent/license, device, camera, lighting,
                print/page, and capture-condition metadata.

          Acceptance:

          - [x] A desktop Rust integration test processes all generated PNGs without Android through bounded
                encoded-image decoding, Gray8 conversion, and quality measurement; detects/resolves marker IDs
                `0..=3` on the canonical page; and confirms corrupt controls fail without fabricated success.
          - [ ] Android calls the same shared processing path. This remains a Milestone 8 integration task.

          Validation evidence:

          - GitHub Actions native/fixture run `30315949013` passed deterministic regeneration and byte-drift
            comparison, fixture clippy/tests, pinned Android `arm64-v8a`/`x86_64` native builds, and future Apple
            compile-feasibility checks.
          - GitHub Actions full CI run `30315948996` passed workspace formatting/clippy/tests,
            dependency/license checks, Android lint/tests/debug APK assembly, and Kotlin binding drift.
          '''
          if text.count(old_section) != 1:
              raise SystemExit("Milestone 7.8 section anchor not found exactly once")
          text = text.replace(old_section, new_section, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify only the TODO changed
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "docs/A2D_SMART_NOTEBOOK_V01_TODO.md" || {
            echo "Unexpected changed paths:" >&2
            echo "$changed" >&2
            exit 1
          }
      - name: Commit checklist reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md
          git commit -m "Document Milestone 7 synthetic fixture evidence"
          git push origin HEAD:${{ github.head_ref }}

  synthetic-fixtures:
    name: Regenerate and verify synthetic scan fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scan-fixtures-requirements.txt

      - name: Install pinned fixture dependency
        run: python -m pip install --requirement tools/scan-fixtures-requirements.txt

      - uses: Swatinem/rust-cache@v2

      - name: Verify Rust formatting and render official support assets
        run: |
          cargo fmt --check
          rm -rf target/fixture-support target/generated-scan-fixtures
          cargo run -p a2d-image --features fixture-tools --bin a2d-fixture-support -- target/fixture-support

      - name: Regenerate and verify synthetic corpus
        run: |
          python tools/generate_scan_fixtures.py \
            --support-dir target/fixture-support \
            --output-dir target/generated-scan-fixtures
          python tools/verify_scan_fixtures.py \
            --fixture-dir target/generated-scan-fixtures

      - name: Fail on generated fixture drift
        run: |
          for path in \
            generated \
            glare \
            blur \
            missing-marker \
            wrong-layout \
            duplicate \
            revisions \
            corrupted \
            manifest.json
          do
            diff -r "fixtures/scans/${path}" "target/generated-scan-fixtures/${path}"
          done

      - name: Run fixture Rust quality gates
        run: |
          cargo clippy -p a2d-image --all-targets --all-features -- -D warnings
          cargo test -p a2d-image --all-features

  desktop-and-android:
    name: Desktop detector and Android native ABIs
    runs-on: ubuntu-24.04
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "A2D_EXPECTED_NDK_VERSION=${A2D_ANDROID_NDK_VERSION}"
            echo "A2D_REQUIRE_EXPLICIT_NDK_HOME=1"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Validate official AprilTag detector and Android builds
        id: android-build
        continue-on-error: true
        run: bash ./tools/validate-milestone7-native.sh > milestone7-android.log 2>&1
      - name: Upload compact Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-android-build-log
          path: milestone7-android.log
          if-no-files-found: error
      - name: Report Android build failure
        if: steps.android-build.outcome == 'failure'
        run: |
          cat milestone7-android.log || true
          exit 1

  ios-feasibility:
    name: Future iOS native compile feasibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust and Xcode toolchains
        run: rustc --version && cargo --version && xcodebuild -version
      - uses: Swatinem/rust-cache@v2
      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Compile a2d-image for iOS device
        id: ios-device
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios > ios-device.log 2>&1
      - name: Compile a2d-image for Apple Silicon simulator
        id: ios-simulator
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios-sim > ios-simulator.log 2>&1
      - name: Upload compact iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-ios-build-logs
          path: |
            ios-device.log
            ios-simulator.log
          if-no-files-found: error
      - name: Report iOS build failures
        if: steps.ios-device.outcome == 'failure' || steps.ios-simulator.outcome == 'failure'
        run: |
          echo '=== iOS device build ==='
          cat ios-device.log || true
          echo '=== Apple Silicon simulator build ==='
          cat ios-simulator.log || true
          exit 1
