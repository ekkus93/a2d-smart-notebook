name: Milestone 7 Native Validation

on:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "crates/a2d-image/**"
      - "tools/validate-milestone7-native.sh"
      - ".github/workflows/milestone7-native.yml"
  workflow_dispatch:

concurrency:
  group: milestone7-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolution-snapshot:
    name: Resolve lockfile and formatted Rust sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Resolve dependency graph and compile image crate
        run: cargo check -p a2d-image --all-features
      - name: Upload resolution snapshot
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-resolution-snapshot
          path: |
            Cargo.lock
            crates/a2d-image/Cargo.toml
            crates/a2d-image/src
          if-no-files-found: error

  desktop-and-android:
    name: Desktop detector and Android native ABIs
    runs-on: ubuntu-24.04
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "A2D_EXPECTED_NDK_VERSION=${A2D_ANDROID_NDK_VERSION}"
            echo "A2D_REQUIRE_EXPLICIT_NDK_HOME=1"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Validate official AprilTag detector and Android builds
        id: android-build
        continue-on-error: true
        run: bash ./tools/validate-milestone7-native.sh > milestone7-android.log 2>&1
      - name: Upload compact Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-android-build-log
          path: milestone7-android.log
          if-no-files-found: error
      - name: Report Android build failure
        if: steps.android-build.outcome == 'failure'
        run: |
          cat milestone7-android.log || true
          exit 1

  ios-feasibility:
    name: Future iOS native compile feasibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust and Xcode toolchains
        run: rustc --version && cargo --version && xcodebuild -version
      - uses: Swatinem/rust-cache@v2
      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Compile a2d-image for iOS device
        id: ios-device
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios > ios-device.log 2>&1
      - name: Compile a2d-image for Apple Silicon simulator
        id: ios-simulator
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios-sim > ios-simulator.log 2>&1
      - name: Upload compact iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-ios-build-logs
          path: |
            ios-device.log
            ios-simulator.log
          if-no-files-found: error
      - name: Report iOS build failures
        if: steps.ios-device.outcome == 'failure' || steps.ios-simulator.outcome == 'failure'
        run: |
          echo '=== iOS device build ==='
          cat ios-device.log || true
          echo '=== Apple Silicon simulator build ==='
          cat ios-simulator.log || true
          exit 1
