name: Milestone 7 Native Validation

on:
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "crates/a2d-image/**"
      - "fixtures/scans/**"
      - "tools/generate_scan_fixtures.py"
      - "tools/scan-fixtures-requirements.txt"
      - "tools/verify_scan_fixtures.py"
      - "tools/validate-milestone7-native.sh"
      - ".github/workflows/milestone7-native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone7-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-fixtures:
    name: Generate and validate synthetic scan fixtures
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/milestone-7-native-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Preserve photographed fixtures and fit rotated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/generate_scan_fixtures.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace('        "photographed",\n', '', 1)
          manifest_anchor = '    manifest = output_dir / "manifest.json"\n'
          photographed_guard = '    (output_dir / "photographed").mkdir(parents=True, exist_ok=True)\n'
          if photographed_guard not in text:
              if text.count(manifest_anchor) != 1:
                  raise SystemExit("manifest anchor not found exactly once")
              text = text.replace(manifest_anchor, photographed_guard + manifest_anchor, 1)

          old_rotation = '''    scene = Image.new("RGBA", (SCENE_WIDTH, SCENE_HEIGHT), BACKGROUND + (255,))
              left = (SCENE_WIDTH - rotated.width) // 2
              top = (SCENE_HEIGHT - rotated.height) // 2
              scene.alpha_composite(rotated, (left, top))
          '''
          new_rotation = '''    maximum_width = SCENE_WIDTH - 100
              maximum_height = SCENE_HEIGHT - 100
              if rotated.width > maximum_width or rotated.height > maximum_height:
                  scale = min(maximum_width / rotated.width, maximum_height / rotated.height)
                  rotated = rotated.resize(
                      (max(1, round(rotated.width * scale)), max(1, round(rotated.height * scale))),
                      resample=Image.Resampling.LANCZOS,
                  )
              scene = Image.new("RGBA", (SCENE_WIDTH, SCENE_HEIGHT), BACKGROUND + (255,))
              left = (SCENE_WIDTH - rotated.width) // 2
              top = (SCENE_HEIGHT - rotated.height) // 2
              scene.alpha_composite(rotated, (left, top))
          '''
          if "maximum_width = SCENE_WIDTH - 100" not in text:
              if text.count(old_rotation) != 1:
                  raise SystemExit("rotated scene anchor not found exactly once")
              text = text.replace(old_rotation, new_rotation, 1)

          if '        "photographed",\n' in text:
              raise SystemExit("synthetic generator still deletes photographed fixtures")
          if photographed_guard not in text:
              raise SystemExit("photographed directory guard is missing")
          if "maximum_width = SCENE_WIDTH - 100" not in text:
              raise SystemExit("rotated page fit is missing")

          path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scan-fixtures-requirements.txt

      - name: Install pinned fixture dependency
        run: python -m pip install --requirement tools/scan-fixtures-requirements.txt

      - uses: Swatinem/rust-cache@v2

      - name: Format and render official fixture support assets
        id: fixture-support
        continue-on-error: true
        run: |
          {
            cargo fmt --all
            rm -rf target/fixture-support
            cargo run -p a2d-image --features fixture-tools --bin a2d-fixture-support -- target/fixture-support
          } > fixture-support.log 2>&1

      - name: Upload compact fixture support log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-fixture-support-log
          path: fixture-support.log
          if-no-files-found: error

      - name: Report fixture support failure
        if: steps.fixture-support.outcome == 'failure'
        run: |
          cat fixture-support.log || true
          exit 1

      - name: Generate and verify synthetic corpus
        run: |
          python tools/generate_scan_fixtures.py \
            --support-dir target/fixture-support \
            --output-dir fixtures/scans
          python tools/verify_scan_fixtures.py --fixture-dir fixtures/scans

      - name: Run fixture Rust quality gates
        run: |
          cargo fmt --check
          cargo clippy -p a2d-image --all-targets --all-features -- -D warnings
          cargo test -p a2d-image --all-features

      - name: Verify generated-change scope
        run: |
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(Cargo.lock|crates/a2d-image/|tools/generate_scan_fixtures.py|tools/scan-fixtures-requirements.txt|tools/verify_scan_fixtures.py|fixtures/scans/)' || true)
          test -z "$unexpected" || {
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          }

      - name: Commit validated synthetic corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/a2d-image tools/generate_scan_fixtures.py \
            tools/scan-fixtures-requirements.txt tools/verify_scan_fixtures.py fixtures/scans
          if git diff --cached --quiet; then
            echo "No synthetic fixture changes required"
            exit 0
          fi
          git commit -m "Generate Milestone 7 synthetic scan fixtures"
          git push origin HEAD:${{ github.head_ref }}

  desktop-and-android:
    name: Desktop detector and Android native ABIs
    runs-on: ubuntu-24.04
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install and select pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "A2D_EXPECTED_NDK_VERSION=${A2D_ANDROID_NDK_VERSION}"
            echo "A2D_REQUIRE_EXPLICIT_NDK_HOME=1"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Validate official AprilTag detector and Android builds
        id: android-build
        continue-on-error: true
        run: bash ./tools/validate-milestone7-native.sh > milestone7-android.log 2>&1
      - name: Upload compact Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-android-build-log
          path: milestone7-android.log
          if-no-files-found: error
      - name: Report Android build failure
        if: steps.android-build.outcome == 'failure'
        run: |
          cat milestone7-android.log || true
          exit 1

  ios-feasibility:
    name: Future iOS native compile feasibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show resolved Rust and Xcode toolchains
        run: rustc --version && cargo --version && xcodebuild -version
      - uses: Swatinem/rust-cache@v2
      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Compile a2d-image for iOS device
        id: ios-device
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios > ios-device.log 2>&1
      - name: Compile a2d-image for Apple Silicon simulator
        id: ios-simulator
        continue-on-error: true
        run: cargo check -p a2d-image --target aarch64-apple-ios-sim > ios-simulator.log 2>&1
      - name: Upload compact iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone7-ios-build-logs
          path: |
            ios-device.log
            ios-simulator.log
          if-no-files-found: error
      - name: Report iOS build failures
        if: steps.ios-device.outcome == 'failure' || steps.ios-simulator.outcome == 'failure'
        run: |
          echo '=== iOS device build ==='
          cat ios-device.log || true
          echo '=== Apple Silicon simulator build ==='
          cat ios-simulator.log || true
          exit 1
