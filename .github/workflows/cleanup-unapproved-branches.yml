name: Remove unapproved temporary branches

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-unapproved-branches.yml

permissions:
  contents: write

concurrency:
  group: remove-unapproved-temporary-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Delete unapproved remote branches
        run: |
          for branch in \
            automation/milestone9-registration-apply \
            automation/validate-m9-registration-master \
            automation/validate-m9-registration-master-v2 \
            feature/m9-fingerprint-foundation
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Remove this one-use workflow from master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-unapproved-branches.yml
          git commit -m "Remove one-use branch cleanup"
          git push origin HEAD:master
