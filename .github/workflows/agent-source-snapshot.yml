name: Apply Milestone 6 Android

on:
  push:
    branches: [master]
    paths:
      - tools/apply_milestone6_android.py
      - tools/milestone6_android_trigger.txt
      - .github/workflows/agent-source-snapshot.yml

concurrency:
  group: milestone6-android-apply
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Apply Android UI and run full gates
        id: gates
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/milestone6-android.log"
          (
            set -euo pipefail
            python3 tools/apply_milestone6_android.py
            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features

            # Generate the Kotlin interface from the desktop cdylib first. This catches Kotlin/API
            # problems before spending time installing an Android NDK toolchain.
            cargo build -p a2d-ffi --lib
            rm -rf /tmp/a2d-m6-kotlin apps/android/app/src/main/kotlin/uniffi
            cargo run -p a2d-ffi --bin uniffi-bindgen -- generate \
              --library target/debug/liba2d_ffi.so \
              --language kotlin \
              --out-dir /tmp/a2d-m6-kotlin \
              --no-format
            mkdir -p apps/android/app/src/main/kotlin/uniffi/a2d_ffi
            cp /tmp/a2d-m6-kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
              apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
            (cd apps/android && ./gradlew lint test assembleDebug --no-daemon)

            # Only a source tree that already passed Android lint/tests gets the slower native build.
            rustup target add x86_64-linux-android
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
            sdkmanager --install "ndk;27.0.12077973"
            if ! command -v cargo-ndk >/dev/null 2>&1; then
              cargo install cargo-ndk --locked
            fi
            ./tools/build-android-native.sh
            (cd apps/android && ./gradlew assembleDebug --no-daemon)
          ) >"$LOG" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log=$LOG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated Android implementation
        if: steps.gates.outputs.status == '0'
        shell: bash
        run: |
          rm -f docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android docs/MILESTONE6_APPLY_STATUS.md
          if git diff --cached --quiet; then
            echo "No Android changes to commit"
          else
            git commit -m "Implement Milestone 6 Android workflows"
            git push origin HEAD:master
          fi
      - name: Publish failure diagnostics without broken source
        if: steps.gates.outputs.status != '0'
        shell: bash
        run: |
          LOG="${{ steps.gates.outputs.log }}"
          git reset --hard HEAD
          {
            echo "# Milestone 6 Android apply failure"
            echo
            echo '```text'
            tail -n 600 "$LOG"
            echo '```'
          } > docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MILESTONE6_APPLY_STATUS.md
          git commit -m "Record Milestone 6 Android apply failure"
          git push origin HEAD:master
          exit 1
