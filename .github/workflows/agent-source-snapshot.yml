name: Apply Milestone 6

on:
  push:
    branches: [master]
    paths:
      - tools/apply_milestone6.py
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Apply transformations and run Rust gates
        id: gates
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/milestone6-rust.log"
          {
            python3 tools/apply_milestone6.py
            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
          } >"$LOG" 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "log=$LOG" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validated Rust implementation
        if: steps.gates.outputs.status == '0'
        shell: bash
        run: |
          rm -f docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates docs/MILESTONE6_APPLY_STATUS.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Implement Milestone 6 Rust notebook workflows"
            git push origin HEAD:master
          fi
      - name: Publish failure diagnostics without broken source
        if: steps.gates.outputs.status != '0'
        shell: bash
        run: |
          LOG="${{ steps.gates.outputs.log }}"
          git reset --hard HEAD
          {
            echo "# Milestone 6 apply failure"
            echo
            echo '```text'
            tail -n 500 "$LOG"
            echo '```'
          } > docs/MILESTONE6_APPLY_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MILESTONE6_APPLY_STATUS.md
          git commit -m "Record Milestone 6 Rust apply failure"
          git push origin HEAD:master
          exit 1
