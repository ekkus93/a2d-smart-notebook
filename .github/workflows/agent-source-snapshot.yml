name: Agent source snapshot

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checked-out source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/a2d-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: a2d-source-${{ github.sha }}
          path: ${{ runner.temp }}/a2d-source.tar.gz
          if-no-files-found: error
          retention-days: 1
