name: Apply FIX-020 durability documentation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-fix020-durability-docs.yml

permissions:
  contents: write

concurrency:
  group: apply-fix020-durability-docs
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact documentation replacements
        run: python3 tools/apply_fix020_durability_docs.py

      - name: Remove one-time reconciler
        run: |
          git rm tools/apply_fix020_durability_docs.py
          git rm .github/workflows/apply-fix020-durability-docs.yml

      - name: Commit reconciled durability documentation
        run: |
          if git diff --quiet --cached && git diff --quiet; then
            echo 'FIX-020 reconciler made no changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/a2d-storage/src/assets.rs
          git add crates/a2d-storage/src/lib.rs
          git add docs/A2D_SMART_NOTEBOOK_V01_SPEC.md
          git add docs/A2D_SMART_NOTEBOOK_V01_TODO.md
          git add docs/A2D_SMART_NOTEBOOK_CODE_REVIEW_FIX_TODO_2026-07-28.md
          git commit -m 'Reconcile FIX-020 durability terminology'
          git push origin HEAD:master
