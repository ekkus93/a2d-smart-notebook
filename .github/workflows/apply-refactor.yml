name: Apply Repository Entity Refactor

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: apply-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.ref == 'agent/refactor-repository-entities'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-repository-entities
          fetch-depth: 0

      - name: Apply deterministic module split
        run: python3 tools/refactor_modules.py

      - name: Format Rust code
        run: cargo fmt --all

      - name: Enforce file-size target
        run: |
          test "$(wc -l < crates/a2d-storage/src/repository.rs)" -lt 800
          test "$(wc -l < crates/a2d-domain/src/entities.rs)" -lt 800
          wc -l \
            crates/a2d-storage/src/repository.rs \
            crates/a2d-storage/src/repository/capture.rs \
            crates/a2d-domain/src/entities.rs \
            crates/a2d-domain/src/entities/derived.rs

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run dependency and license checks
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Commit validated refactor
        run: |
          rm -f tools/refactor_modules.py
          rm -f .github/workflows/apply-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refactor repository and entity modules"
          git push origin HEAD:agent/refactor-repository-entities
