name: Validate CameraX adapter

on:
  push:
    branches: [master]

permissions:
  contents: write
  statuses: write

concurrency:
  group: validate-camerax-adapter
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{\"state\":\"pending\",\"context\":\"a2d/camerax-adapter\",\"description\":\"CameraX adapter validation is running\",\"target_url\":\"%s\"}' "$run_url")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3

      - name: Install pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked

      - name: Run Rust and printable compatibility gates
        run: |
          set -o pipefail
          {
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            cargo run -p a2d-pdf --features fixture-tools \
              --bin a2d-qr-v1-fixtures -- target/generated-qr-v1
            diff -r fixtures/qr/v1 target/generated-qr-v1
          } 2>&1 | tee camerax-rust-validation.log

      - name: Build packaged Android native libraries
        run: |
          set -o pipefail
          bash ./tools/build-android-native-libs.sh "arm64-v8a x86_64" \
            2>&1 | tee camerax-native-build.log

      - name: Run Android lint, unit tests, and APK assembly
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew lint test assembleDebug --no-daemon \
            2>&1 | tee ../../camerax-android-validation.log

      - name: Verify APK packaging
        run: |
          python tools/verify-android-apk.py \
            apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{\"state\":\"failure\",\"context\":\"a2d/camerax-adapter\",\"description\":\"CameraX adapter validation failed\",\"target_url\":\"%s\"}' "$run_url")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: camerax-adapter-failure-logs
          path: camerax-*.log
          if-no-files-found: warn

      - name: Publish successful status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{\"state\":\"success\",\"context\":\"a2d/camerax-adapter\",\"description\":\"CameraX adapter validation passed\",\"target_url\":\"%s\"}' "$run_url")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"

      - name: Remove one-time validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-camerax-adapter.yml
          git commit -m "Remove one-time CameraX validation workflow [skip ci]"
          git push origin HEAD:master
