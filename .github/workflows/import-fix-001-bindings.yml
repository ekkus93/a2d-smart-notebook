name: Import FIX-001 Generated Bindings

on:
  push:
    branches: [master]

permissions:
  actions: read
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Import verified FIX-001 generated bindings'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify generator artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: "8738669551"
          ARTIFACT_SHA256: "dd615fc8347585d048ac9e52d41eb3b629fddcb5c870af21ac9e700b44484616"
          ARTIFACT_HEAD_SHA: "2849303af3e8e5fe692da750c3a40f4498bd34b3"
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${ARTIFACT_HEAD_SHA}" HEAD
          test -z "$(git diff --name-only "${ARTIFACT_HEAD_SHA}"..HEAD -- crates/a2d-ffi crates/a2d-core)"

          artifact_zip="${RUNNER_TEMP}/regenerated-android-ffi-files.zip"
          artifact_dir="${RUNNER_TEMP}/regenerated-android-ffi-files"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "${artifact_zip}"
          printf '%s  %s\n' "${ARTIFACT_SHA256}" "${artifact_zip}" | sha256sum --check --strict
          mkdir -p "${artifact_dir}"
          unzip -q "${artifact_zip}" -d "${artifact_dir}"

          generated_binding="${artifact_dir}/apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt"
          generated_lock="${artifact_dir}/Cargo.lock"
          test -s "${generated_binding}"
          test -s "${generated_lock}"
          grep -Fq 'compareStoredScans' "${generated_binding}"
          grep -Fq 'A2dFfiErrorDetail' "${generated_binding}"
          grep -Fq 'StoredScanComparisonEvidence' "${generated_binding}"

          install -m 0644 \
            "${generated_binding}" \
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
          install -m 0644 "${generated_lock}" Cargo.lock

      - name: Apply clippy-only source cleanups
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {before!r}, found {count}")
              file.write_text(text.replace(before, after), encoding="utf-8")

          replace_once(
              "crates/a2d-pdf/src/render.rs",
              "let mut detector = AprilTagDetector::new(DetectorConfig::default())?;",
              "let detector = AprilTagDetector::new(DetectorConfig::default())?;",
          )
          replace_once(
              "crates/a2d-image/src/detection.rs",
              "MarkerIdLayout::new(assignments.into_iter())",
              "MarkerIdLayout::new(assignments)",
          )
          PY
          cargo fmt --all

      - name: Validate focused Rust and binding gates
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p a2d-pdf -p a2d-image --all-targets --all-features -- -D warnings
          cargo test -p a2d-ffi --test binding_generation

      - name: Commit exact generated files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-fix-001-bindings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "Regenerate UniFFI bindings and clear focused clippy gates"
          git push origin HEAD:master
