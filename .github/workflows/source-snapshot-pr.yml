name: Source Snapshot PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude='.git' --exclude='target' -czf a2d-smart-notebook-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: a2d-smart-notebook-source
          path: a2d-smart-notebook-source.tar.gz
          if-no-files-found: error
          retention-days: 1
