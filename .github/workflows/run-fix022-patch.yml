name: Run FIX-022 patch

on:
  push:
    branches: [master]
    paths:
      - tools/run-fix022-patch.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run exact patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-fix022-scan-rollback.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          code_lines = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          Path('/tmp/apply_fix022.py').write_text('\n'.join(code_lines) + '\n')
          PY
          python3 /tmp/apply_fix022.py

      - name: Commit FIX-022 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-core/src/milestone9.rs crates/a2d-core/src/milestone9_tests.rs
          git diff --cached --check
          git commit -m "Normalize generic scan rollback evidence"
          git push origin HEAD:master
