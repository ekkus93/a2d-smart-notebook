name: Apply Milestone 7 Resolution

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/apply-milestone7-resolution.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
      - name: Apply canonical formatting and resolve dependencies
        run: |
          cargo fmt --all
          cargo check -p a2d-image --all-features
      - name: Commit only the resolved Milestone 7 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/a2d-image/Cargo.toml crates/a2d-image/src
          git diff --cached --quiet && exit 0
          git commit -m "Format and resolve Milestone 7 image inputs"
          git push origin HEAD:agent/milestone-7-native-validation
