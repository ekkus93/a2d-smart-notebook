name: Apply Milestone 7 Rectification Wiring

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/apply-milestone7-rectification-wiring.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation
      - name: Add validated owned-image constructors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/a2d-image/src/encoded.rs")
          text = path.read_text()

          rgb_anchor = """impl OwnedRgbImage {
    pub const fn width(&self) -> u32 {
"""
          rgb_replacement = """impl OwnedRgbImage {
    pub(crate) fn from_tight(
        width: u32,
        height: u32,
        rotation: ImageRotation,
        bytes: Vec<u8>,
    ) -> Result<Self, A2dError> {
        let pixel_count = checked_pixel_count(width, height)?;
        let required_bytes = pixel_count.checked_mul(3).ok_or_else(|| {
            validation_error(
                \"IMAGE_BUFFER_SIZE_OVERFLOW\",
                format!(\"RGB buffer size overflow for {width}x{height}\"),
            )
        })?;
        let required_bytes = usize::try_from(required_bytes).map_err(|_| {
            validation_error(
                \"IMAGE_BUFFER_SIZE_UNSUPPORTED\",
                \"RGB buffer does not fit this platform's address space\",
            )
        })?;
        if bytes.len() != required_bytes {
            return Err(validation_error(
                \"IMAGE_RGB_BUFFER_LENGTH_INVALID\",
                format!(
                    \"RGB buffer has {} bytes but {required_bytes} are required\",
                    bytes.len()
                ),
            ));
        }
        let row_stride = usize::try_from(width)
            .ok()
            .and_then(|value| value.checked_mul(3))
            .ok_or_else(|| {
                validation_error(
                    \"IMAGE_STRIDE_INVALID\",
                    format!(\"RGB row stride overflow for width {width}\"),
                )
            })?;
        Ok(Self {
            width,
            height,
            row_stride,
            rotation,
            bytes,
        })
    }

    pub const fn width(&self) -> u32 {
"""
          if "pub(crate) fn from_tight(" not in text:
              if text.count(rgb_anchor) != 1:
                  raise SystemExit("OwnedRgbImage anchor not found exactly once")
              text = text.replace(rgb_anchor, rgb_replacement, 1)

          gray_anchor = """impl OwnedGrayImage {
    pub const fn width(&self) -> u32 {
"""
          gray_replacement = """impl OwnedGrayImage {
    pub(crate) fn from_tight(
        width: u32,
        height: u32,
        rotation: ImageRotation,
        bytes: Vec<u8>,
    ) -> Result<Self, A2dError> {
        let required_bytes = checked_pixel_count(width, height)?;
        let required_bytes = usize::try_from(required_bytes).map_err(|_| {
            validation_error(
                \"IMAGE_BUFFER_SIZE_UNSUPPORTED\",
                \"Gray8 buffer does not fit this platform's address space\",
            )
        })?;
        if bytes.len() != required_bytes {
            return Err(validation_error(
                \"IMAGE_GRAY_BUFFER_LENGTH_INVALID\",
                format!(
                    \"Gray8 buffer has {} bytes but {required_bytes} are required\",
                    bytes.len()
                ),
            ));
        }
        let row_stride = usize::try_from(width).map_err(|_| {
            validation_error(
                \"IMAGE_STRIDE_INVALID\",
                format!(\"Gray8 row stride overflow for width {width}\"),
            )
        })?;
        Ok(Self {
            width,
            height,
            row_stride,
            rotation,
            bytes,
        })
    }

    pub const fn width(&self) -> u32 {
"""
          if text.count("pub(crate) fn from_tight(") == 1:
              if text.count(gray_anchor) != 1:
                  raise SystemExit("OwnedGrayImage anchor not found exactly once")
              text = text.replace(gray_anchor, gray_replacement, 1)

          if text.count("pub(crate) fn from_tight(") != 2:
              raise SystemExit("expected exactly two owned-image constructors")
          path.write_text(text)
          PY
      - name: Format and validate rectification
        run: |
          cargo fmt --all
          cargo clippy -p a2d-image --all-targets --all-features -- -D warnings
          cargo test -p a2d-image --all-features
      - name: Commit only rectification wiring and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-image/src
          git diff --cached --quiet && exit 0
          git commit -m "Validate Milestone 7 page rectification"
          git push origin HEAD:agent/milestone-7-native-validation
