name: Delete temporary printable validation tag

on:
  push:
    branches: [master]

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary validation tag
        run: git push origin :refs/tags/a2d-printable-validated-temp
      - name: Publish tag cleanup status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{\"state\":\"success\",\"context\":\"a2d/printable-tag-cleanup\",\"description\":\"Temporary printable validation tag deleted\",\"target_url\":\"%s\"}' "$run_url")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"
