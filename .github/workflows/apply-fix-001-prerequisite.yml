name: Apply FIX-001 Compile Prerequisite

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply FIX-001 compile prerequisite'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire transaction repository adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/a2d-storage/src/lib.rs")
          text = source.read_text(encoding="utf-8")
          before = "mod repository;\nmod workflow;"
          after = "mod repository;\nmod transaction_repository;\nmod workflow;"
          if text.count(before) != 1:
              raise SystemExit("expected exactly one repository/workflow module boundary")
          source.write_text(text.replace(before, after), encoding="utf-8")

          workflow = Path(".github/workflows/apply-fix-001-prerequisite.yml")
          workflow.unlink()
          PY
      - name: Commit validated source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/a2d-storage/src/lib.rs .github/workflows/apply-fix-001-prerequisite.yml
          git diff --cached --check
          git commit -m "Wire transaction repository trait adapters"
          git push origin HEAD:master
