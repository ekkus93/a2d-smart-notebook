name: Update Android UniFFI bindings

on:
  push:
    branches: [master]
    paths:
      - "crates/a2d-ffi/**"
      - "crates/a2d-core/**"
      - "crates/a2d-domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/build-android-native.sh"
      - ".github/workflows/update-android-bindings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-android-uniffi-bindings
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      A2D_ANDROID_NDK_VERSION: "27.0.12077973"
      A2D_CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Regenerate canonical Kotlin binding
        run: bash ./tools/build-android-native.sh "x86_64"
      - name: Commit exact generated outputs
        run: |
          if git diff --quiet -- \
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
            Cargo.lock; then
            echo "Generated Android FFI files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt \
            Cargo.lock
          git commit -m "Regenerate Android UniFFI bindings"
          git push origin HEAD:master
