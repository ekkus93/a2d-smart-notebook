name: Source Snapshot PR v2

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude='.git' --exclude='target' -czf "$RUNNER_TEMP/a2d-smart-notebook-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: a2d-smart-notebook-source-v2
          path: ${{ runner.temp }}/a2d-smart-notebook-source.tar.gz
          if-no-files-found: error
          retention-days: 1
