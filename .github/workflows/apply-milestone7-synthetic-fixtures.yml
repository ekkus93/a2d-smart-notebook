name: Apply Milestone 7 Synthetic Fixtures

on:
  push:
    branches:
      - agent/milestone-7-native-validation
    paths:
      - ".github/workflows/apply-milestone7-synthetic-fixtures.yml"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/milestone-7-native-validation

      - name: Preserve photographed fixtures and fit rotated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/generate_scan_fixtures.py")
          text = path.read_text(encoding="utf-8")

          old_categories = '''        "generated",
                  "photographed",
                  "glare",'''
          new_categories = '''        "generated",
                  "glare",'''
          if old_categories in text:
              text = text.replace(old_categories, new_categories, 1)

          old_manifest = '''    manifest = output_dir / "manifest.json"
              if manifest.exists():
                  manifest.unlink()
          '''
          new_manifest = '''    (output_dir / "photographed").mkdir(parents=True, exist_ok=True)
              manifest = output_dir / "manifest.json"
              if manifest.exists():
                  manifest.unlink()
          '''
          if old_manifest in text:
              text = text.replace(old_manifest, new_manifest, 1)

          old_rotation = '''    scene = Image.new("RGBA", (SCENE_WIDTH, SCENE_HEIGHT), BACKGROUND + (255,))
              left = (SCENE_WIDTH - rotated.width) // 2
              top = (SCENE_HEIGHT - rotated.height) // 2
              scene.alpha_composite(rotated, (left, top))
          '''
          new_rotation = '''    maximum_width = SCENE_WIDTH - 100
              maximum_height = SCENE_HEIGHT - 100
              if rotated.width > maximum_width or rotated.height > maximum_height:
                  scale = min(maximum_width / rotated.width, maximum_height / rotated.height)
                  rotated = rotated.resize(
                      (max(1, round(rotated.width * scale)), max(1, round(rotated.height * scale))),
                      resample=Image.Resampling.LANCZOS,
                  )
              scene = Image.new("RGBA", (SCENE_WIDTH, SCENE_HEIGHT), BACKGROUND + (255,))
              left = (SCENE_WIDTH - rotated.width) // 2
              top = (SCENE_HEIGHT - rotated.height) // 2
              scene.alpha_composite(rotated, (left, top))
          '''
          if old_rotation in text:
              text = text.replace(old_rotation, new_rotation, 1)

          if '"photographed",\n        "glare"' in text:
              raise SystemExit("synthetic generator still deletes photographed fixtures")
          if '(output_dir / "photographed").mkdir' not in text:
              raise SystemExit("photographed directory preservation patch did not apply")
          if "maximum_width = SCENE_WIDTH - 100" not in text:
              raise SystemExit("rotated page fit patch did not apply")

          path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scan-fixtures-requirements.txt

      - name: Install pinned fixture dependency
        run: python -m pip install --requirement tools/scan-fixtures-requirements.txt

      - uses: Swatinem/rust-cache@v2

      - name: Format Rust and generate official support rasters
        run: |
          cargo fmt --all
          rm -rf target/fixture-support
          cargo run -p a2d-image --features fixture-tools --bin a2d-fixture-support -- target/fixture-support

      - name: Generate and verify synthetic scan corpus
        run: |
          python tools/generate_scan_fixtures.py \
            --support-dir target/fixture-support \
            --output-dir fixtures/scans
          python tools/verify_scan_fixtures.py --fixture-dir fixtures/scans

      - name: Run Rust quality gates
        run: |
          cargo fmt --check
          cargo clippy -p a2d-image --all-targets --all-features -- -D warnings
          cargo test -p a2d-image --all-features

      - name: Verify scope and commit generated corpus
        run: |
          git status --short
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev '^(.github/workflows/apply-milestone7-synthetic-fixtures.yml|Cargo.lock|crates/a2d-image/Cargo.toml|crates/a2d-image/src/bin/a2d_fixture_support.rs|tools/generate_scan_fixtures.py|tools/scan-fixtures-requirements.txt|tools/verify_scan_fixtures.py|fixtures/scans/)' || true)
          test -z "$unexpected" || {
            echo "Unexpected changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/a2d-image tools fixtures/scans
          if git diff --cached --quiet; then
            echo "No fixture changes to commit"
            exit 0
          fi
          git commit -m "Generate Milestone 7 synthetic scan fixtures"
          git push origin HEAD:agent/milestone-7-native-validation
