name: Generate Milestone 8.4 bindings

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: milestone-8-4-bindings
  cancel-in-progress: true

env:
  A2D_ANDROID_NDK_VERSION: "27.0.12077973"
  A2D_CARGO_NDK_VERSION: "4.1.2"

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip m8-4-bindings]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Apply reviewed Rust fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/a2d-ffi/src/milestone8.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """#[derive(Clone, Debug, uniffi::Enum)]
          pub enum ProcessEncodedPagePreviewOutcome {
              Completed {
                  result: ProcessEncodedPagePreviewResult,
              },
              Cancelled,
          }
          """,
                  """#[derive(Clone, Copy, Debug, Eq, PartialEq, uniffi::Enum)]
          pub enum ProcessEncodedPagePreviewStatus {
              Completed,
              Cancelled,
          }

          #[derive(Clone, Debug, uniffi::Record)]
          pub struct ProcessEncodedPagePreviewOutcome {
              pub status: ProcessEncodedPagePreviewStatus,
              pub result: Option<ProcessEncodedPagePreviewResult>,
          }
          """,
                  1,
              ),
              (
                  """fn is_cancelled(error: &A2dError) -> bool {
              error.code.to_string() == "DERIVED_PROCESSING_CANCELLED"
          }
          """,
                  """fn is_cancelled(error: &A2dError) -> bool {
              error.code.to_string() == "DERIVED_PROCESSING_CANCELLED"
          }

          fn cancelled_outcome() -> ProcessEncodedPagePreviewOutcome {
              ProcessEncodedPagePreviewOutcome {
                  status: ProcessEncodedPagePreviewStatus::Cancelled,
                  result: None,
              }
          }
          """,
                  1,
              ),
              (
                  "return Ok(ProcessEncodedPagePreviewOutcome::Cancelled);",
                  "return Ok(cancelled_outcome());",
                  4,
              ),
              (
                  """        .map(|value| {
                      Ok(SharpenConfig::new(
                          value.amount,
                          to_u8(value.threshold, "sharpening.threshold")?,
                          to_u8(value.passes, "sharpening.passes")?,
                      )?)
                  })
          """,
                  """        .map(|value| {
                      SharpenConfig::new(
                          value.amount,
                          to_u8(value.threshold, "sharpening.threshold")?,
                          to_u8(value.passes, "sharpening.passes")?,
                      )
                  })
          """,
                  1,
              ),
              (
                  """    Ok(ProcessEncodedPagePreviewOutcome::Completed {
                  result: ProcessEncodedPagePreviewResult {
          """,
                  """    Ok(ProcessEncodedPagePreviewOutcome {
                  status: ProcessEncodedPagePreviewStatus::Completed,
                  result: Some(ProcessEncodedPagePreviewResult {
          """,
                  1,
              ),
              (
                  """            source_to_corrected_matrix: matrix,
                  },
              })
          """,
                  """            source_to_corrected_matrix: matrix,
                  }),
              })
          """,
                  1,
              ),
              (
                  """        let ProcessEncodedPagePreviewOutcome::Completed { result } = outcome else {
                      panic!("expected completed preview processing");
                  };
          """,
                  """        assert_eq!(outcome.status, ProcessEncodedPagePreviewStatus::Completed);
                  let result = outcome.result.expect("completed processing must return a result");
          """,
                  1,
              ),
              (
                  """        assert!(matches!(
                      outcome,
                      ProcessEncodedPagePreviewOutcome::Cancelled
                  ));
          """,
                  """        assert_eq!(outcome.status, ProcessEncodedPagePreviewStatus::Cancelled);
                  assert!(outcome.result.is_none());
          """,
                  1,
              ),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"expected {expected} occurrences, found {actual}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install pinned Android native toolchain
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${A2D_ANDROID_NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${A2D_ANDROID_NDK_VERSION}"
          test -d "$ndk_home"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
          } >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${A2D_CARGO_NDK_VERSION}" --locked
      - name: Format and test new Rust API
        id: rust
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo clippy -p a2d-ffi --all-targets --all-features -- -D warnings
            cargo test -p a2d-ffi --all-features
          } 2>&1 | tee milestone-8-4-bindings.log
      - name: Generate Kotlin bindings from packaged native library
        id: bindings
        if: steps.rust.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./tools/build-android-native.sh "x86_64" 2>&1 | tee -a milestone-8-4-bindings.log
      - name: Record generation failure
        if: steps.rust.outcome != 'success' || steps.bindings.outcome != 'success'
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          cp milestone-8-4-bindings.log .github/tmp/milestone-8-4-bindings-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/milestone-8-4-bindings-failure.log crates/a2d-ffi/src/lib.rs crates/a2d-ffi/src/milestone8.rs
          git commit -m "Record Milestone 8.4 binding failure [skip m8-4-bindings]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
          exit 1
      - name: Commit generated binding and remove workflow
        if: steps.rust.outcome == 'success' && steps.bindings.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-milestone-8-4-bindings.yml
          git rm -f .github/tmp/milestone-8-4-bindings-failure.log || true
          git add crates/a2d-ffi/src/lib.rs crates/a2d-ffi/src/milestone8.rs \
            apps/android/app/src/main/kotlin/uniffi/a2d_ffi/a2d_ffi.kt
          git commit -m "Generate Milestone 8.4 scanner preview bindings [skip ci]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
