# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
# Policy configuration for TODO 1.3's CI "dependency/license checks" gate.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # uniffi and its sub-crates (a2d-ffi's core dependency) are MPL-2.0. Weak/file-level
  # copyleft: modifications to MPL-covered *files* must stay MPL if redistributed as source,
  # but linking/combining with differently-licensed code (our app) is explicitly permitted --
  # unlike GPL. We don't modify uniffi's source, only depend on it as a compiled library, so
  # this doesn't affect how our own code can be licensed or distributed.
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (crates/a2d-* depending on each other via `path = "..."`,
# no `version` field) are flagged as "wildcard" by default -- they're not a supply-chain risk
# the way a genuine unconstrained crates.io dependency would be, since a path dependency always
# resolves to the exact local commit, not "any version." Exempted here rather than adding a
# redundant version = "0.1.0" to every intra-workspace dependency declaration.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
